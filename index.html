/* تعديل بند بئر: اسم/قسم/كمية/تكلفة/سعر/تاريخ — وتحديث المخزون أو تكلفة المشروع حسب مصدر البند */
async function editWellItem(id){
  const it=await Q1(sb.from('solar_well_items').select('*').eq('id',id).single());if(!it||it.is_cancelled)return;
  const v=await askForm('تعديل بند بئر — '+esc(it.item_name),[
    {k:'cat',l:'القسم',t:'select',opts:WELL_CATS,v:it.category},
    {k:'item',l:'اسم البند',v:it.item_name,req:1,w:'w2'},
    {k:'qty',l:'الكمية',t:'number',v:it.quantity,req:1},
    {k:'cost',l:'تكلفة الوحدة',t:'number',v:it.unit_cost},
    {k:'price',l:'سعر بيع الوحدة للعميل',t:'number',v:it.unit_price,req:1},
    {k:'date',l:'التاريخ',t:'date',v:String(it.date).slice(0,10)}
  ],{ok:'حفظ التعديل',note:'أي تغيير في الكمية بيتحدّث في المخزون لو البند من مخزون، وأي تغيير في التكلفة بيتحدّث في تكلفة المشروع، وفي الحالتين سعر البئر للعميل بيتحدّث أوتوماتيك.'});
  if(!v)return;
  await once('ewi',async()=>{
    const newQty=num(v.qty),newCost=num(v.cost),oldQty=num(it.quantity),oldCost=num(it.unit_cost);
    if(it.usage_id){
      const usage=await Q1(sb.from('solar_project_material_usage').select('*').eq('id',it.usage_id).maybeSingle());
      if(usage){
        const p=await Q1(sb.from('products').select('*').eq('id',usage.product_id).maybeSingle());
        const deltaQty=newQty-oldQty; // زيادة الكمية = خصم إضافي من المخزون، نقصانها = رجوع للمخزون
        if(p){
          if(deltaQty>0&&num(p.current_quantity)<deltaQty&&!await ask(`الكمية الإضافية أكبر من المتاح حاليًا (${p.current_quantity}). تكمّل والمخزون يبقى بالسالب؟`,{ok:'كمّل'}))return;
          await sb.from('products').update({current_quantity:num(p.current_quantity)-deltaQty}).eq('id',p.id);
          if(Math.abs(deltaQty)>0.0001)await sb.from('inventory_movements').insert({product_id:p.id,branch_id:S.branch,type:'count_adjustment',quantity:-deltaQty,notes:'تعديل بند بئر: '+v.item,related_table:'solar_well_items',related_id:id});
        }
        await sb.from('solar_project_material_usage').update({quantity:newQty,unit_cost:newCost}).eq('id',it.usage_id);
      }
    }
    if(it.cost_id){
      const cost=await Q1(sb.from('solar_project_costs').select('*').eq('id',it.cost_id).maybeSingle());
      if(cost){
        const newTotal=Math.round(newQty*newCost*100)/100,oldTotal=Math.round(oldQty*oldCost*100)/100,diff=Math.round((newTotal-oldTotal)*100)/100;
        if(Math.abs(diff)>0.004&&cost.cash_transaction_id){
          const t=await Q1(sb.from('cash_transactions').select('*, cash_registers(name)').eq('id',cost.cash_transaction_id).maybeSingle());
          if(t&&await ask(`تكلفة البند اتغيّرت من ${fmt(oldTotal)} إلى ${fmt(newTotal)} (فرق ${fmt(diff)}).\nالبند ده اتدفعت تكلفته فعليًا من خزنة "${esc(t.cash_registers?.name||'')}".\nتسجّل الفرق كحركة على نفس الخزنة؟`,{ok:'سجّل الفرق على الخزنة'})){
            await createCashTx({branch_id:t.branch_id,register_id:t.register_id,date:v.date||todayStr(),direction:diff>0?'out':'in',category:t.category,source_type:t.source_type,amount:Math.abs(diff),notes:'فرق تعديل بند بئر: '+v.item});
          }
        }
        await sb.from('solar_project_costs').update({amount:newTotal}).eq('id',it.cost_id);
      }
    }
    await sb.from('solar_well_items').update({category:v.cat,item_name:v.item,quantity:newQty,unit_cost:newCost,unit_price:num(v.price),date:v.date||it.date}).eq('id',id);
    await recomputeWell(it.project_id);toast('تم حفظ التعديل','ok');refresh();
  });
}

async function collectMilestone(id){
  const [m,regs]=await Promise.all([Q1(sb.from('solar_project_payment_milestones').select('*, solar_projects(project_name)').eq('id',id).single()),L.regs()]);if(!m)return;
  const v=await askForm('تحصيل دفعة — '+esc(m.milestone_name),[{k:'amount',l:'المبلغ المحصَّل',t:'number',v:m.due_amount,req:1,hint:'لو أقل من المستحق، الباقي بيتسجّل كدفعة جديدة'},{k:'date',l:'التاريخ',t:'date',v:todayStr(),req:1},{k:'reg',l:'دخل على خزنة',t:'select',opts:regOpts(regs),req:1}],{ok:'تحصيل',check:v=>v.amount<=0?'اكتب مبلغًا صحيحًا':null});if(!v)return;
  await once('mil',async()=>{
    const {data:tx}=await createCashTx({branch_id:S.branch,register_id:v.reg,date:v.date,direction:'in',category:'sale',source_type:'capital',amount:v.amount,notes:'تحصيل دفعة مشروع طاقة شمسية — '+(m.solar_projects?.project_name||'')});if(!tx)return;
    await sb.from('solar_project_payment_milestones').update({status:'paid',paid_amount:v.amount,paid_date:v.date,cash_transaction_id:tx.id}).eq('id',id);
    if(v.amount<num(m.due_amount)-0.01)await sb.from('solar_project_payment_milestones').insert({project_id:m.project_id,branch_id:m.branch_id,milestone_name:m.milestone_name+' (متبقي)',order_index:m.order_index,due_amount:num(m.due_amount)-v.amount,due_date:m.due_date});
    toast('تم التحصيل','ok');refresh();
  });
}

async function cancelMaterial(id){
  if(!await ask('إلغاء حركة الصرف هيرجّع الكمية للمخزون.',{ok:'إلغاء'}))return;
  const row=await Q1(sb.from('solar_project_material_usage').select('*').eq('id',id).single());if(!row)return;
  if(!await M(sb.from('solar_project_material_usage').update({is_cancelled:true}).eq('id',id)))return;
  const p=await Q1(sb.from('products').select('current_quantity').eq('id',row.product_id).maybeSingle());
  if(p){await sb.from('products').update({current_quantity:num(p.current_quantity)+num(row.quantity)}).eq('id',row.product_id);await sb.from('inventory_movements').insert({product_id:row.product_id,branch_id:S.branch,type:'count_adjustment',quantity:num(row.quantity),notes:'إرجاع بسبب إلغاء صرف لمشروع طاقة شمسية',related_table:'solar_project_material_usage',related_id:id});}
  await logAudit('solar_project_material_usage','cancel',id,row);refresh();
}
async function uncancelMaterial(id){
  if(!await ask('التراجع هيخصم الكمية من المخزون تاني. متأكد؟'))return;const row=await Q1(sb.from('solar_project_material_usage').select('*').eq('id',id).single());if(!row)return;
  await sb.from('solar_project_material_usage').update({is_cancelled:false}).eq('id',id);const p=await Q1(sb.from('products').select('current_quantity').eq('id',row.product_id).maybeSingle());
  if(p)await sb.from('products').update({current_quantity:num(p.current_quantity)-num(row.quantity)}).eq('id',row.product_id);refresh();
}
async function deleteMaterial(id){
  const row=await Q1(sb.from('solar_project_material_usage').select('*').eq('id',id).single());
  if(!await ask('حذف نهائي لحركة الصرف.'+(row&&!row.is_cancelled?'\nالكمية هترجع للمخزون تلقائيًا.':''),{danger:true,ok:'احذف'}))return;
  const {data:del,error}=await sb.from('solar_project_material_usage').delete().eq('id',id).select();
  if(error||!del?.length)return toast(error?error.message:'لم يُحذف — صلاحيات RLS غالبًا','err');
  if(row&&!row.is_cancelled){const p=await Q1(sb.from('products').select('current_quantity').eq('id',row.product_id).maybeSingle());if(p)await sb.from('products').update({current_quantity:num(p.current_quantity)+num(row.quantity)}).eq('id',row.product_id);}
  await logAudit('solar_project_material_usage','delete',id,row);refresh();
}

const PO_DELIVERY={reserved:'محجوز',ordered:'تم الطلب',received:'تم الاستلام'};

R['solar.purchases']=async()=>{
  const ps=await L.projects();V.projects=ps;const live=ps.filter(p=>!p.is_cancelled);if(!live.length)return needProj();
  const f=F('po',{proj:live[0].id,st:'all'});if(!live.find(p=>p.id===f.proj))f.proj=live[0].id;
  const proj=live.find(p=>p.id===f.proj);
  const [prof,invs]=await Promise.all([
    Q(sb.from('solar_project_profitability').select('*').eq('branch_id',S.branch)),
    Q(sb.from('supplier_invoices').select('*, suppliers(name)').eq('project_id',proj.id).order('date',{ascending:false}))
  ]);
  const invIds=invs.map(i=>i.id);
  const [mats,pays]=await Promise.all([
    invIds.length?inChunks(ids=>sb.from('solar_outside_materials').select('*').eq('is_cancelled',false).in('supplier_invoice_id',ids),invIds):[],
    invIds.length?inChunks(ids=>sb.from('supplier_payments').select('*').eq('is_cancelled',false).in('invoice_id',ids),invIds):[]
  ]);
  const pr=prof.find(x=>x.project_id===proj.id)||prof.find(x=>x.project_name===proj.project_name)||{};
  const today=todayStr();
  const rowsData=invs.map(i=>{
    const its=mats.filter(m=>m.supplier_invoice_id===i.id);
    const paid=sum(pays.filter(p=>p.invoice_id===i.id),'amount');
    const rem=Math.max(0,num(i.amount)-paid);
    const late=rem>0.01&&i.due_date&&i.due_date<today;
    return {i,its,paid,rem,late};
  });
  const liveRows=rowsData.filter(r=>!r.i.is_cancelled);
  const paidTotal=sum(liveRows,'paid'),remTotal=sum(liveRows,'rem'),purchTotal=sum(liveRows,r=>num(r.i.amount));
  const collected=num(pr.total_collected),contractRem=num(proj.contract_amount)-collected;
  const avail=collected-paidTotal;
  const shown=rowsData.filter(r=>{
    if(f.st==='cancelled')return r.i.is_cancelled;
    if(r.i.is_cancelled)return false;
    if(f.st==='open')return r.rem>0.01;
    if(f.st==='late')return r.late;
    if(f.st==='paid')return r.rem<=0.01;
    return true;

  const rowsHtml=shown.map(({i,its,paid,rem,late})=>{
    const pct=num(i.amount)>0?Math.min(100,Math.round(paid/num(i.amount)*100)):0;
    const names=its.map(m=>m.item_name);const nameStr=names.slice(0,3).join('، ')+(names.length>3?` +${names.length-3}`:'');
    return TR([fdate(i.date),esc(i.suppliers?.name||'-'),esc(nameStr||'-'),`<span class="n">${fmt(i.amount)}</span>`,
      `<div style="display:flex;align-items:center;gap:6px"><span class="n pos">${fmt(paid)}</span><div style="background:var(--line2);border-radius:4px;height:6px;width:60px;overflow:hidden"><div style="background:var(--green);height:100%;width:${pct}%"></div></div></div>`,
      `<span class="n ${rem>0.01?'neg':''}">${fmt(rem)}</span>`,
      rem>0.01&&i.due_date?fdate(i.due_date):'-',
      tag(PO_DELIVERY[i.delivery_status]||i.delivery_status||'-',PO_DTAG[i.delivery_status]||''),
      i.is_cancelled?tag('ملغي','r'):(rem<=0.01?tag('مسدد','g'):late?tag('متأخر','r'):tag('عليه متبقي','a')),
      B('تفاصيل',`showPODetail('${i.id}')`)+(!i.is_cancelled&&rem>0.01?B('دفع',`payPO('${i.id}')`,'ok'):'')+(!i.is_cancelled&&i.delivery_status!=='received'?B('استلمنا',`setPOStatus('${i.id}','received')`,'gd'):'')+(!i.is_cancelled?B('مواعيد',`editPO('${i.id}')`):'')+(!i.is_cancelled?B('إلغاء',`cancelPO('${i.id}')`,'bad'):'')
    ],i.is_cancelled?'dim':late?'late':'');
  });
  return `<div class="toolbar"><div class="left">${chips(live.map(p=>[p.id,esc(p.project_name)]),f.proj,"setF.bind(null,'po','proj')")}</div></div>
  <div class="kpis">${K('قيمة العقد',fmt(proj.contract_amount),'a')}${K('المحصّل من العميل',fmt(collected),'g',contractRem>0.01?'متبقي عليه: '+fmt(contractRem):'خلّص')}${K('إجمالي مشتريات الخامات',fmt(purchTotal),'',liveRows.length+' أمر شراء')}${K('اتدفع للموردين',fmt(paidTotal),'g')}${K('متبقي للموردين',fmt(remTotal),liveRows.some(r=>r.late)?'r':remTotal>0.01?'a':'')}${K('المتاح من تحصيل المشروع',fmt(avail),avail>=0?'g':'r','المحصّل − المدفوع للموردين')}</div>
  ${C('أوامر شراء الخامات',`<div class="toolbar"><div class="left">${chips([['all','الكل'],['open','عليها متبقي'],['late','متأخرة'],['paid','مسددة'],['cancelled','ملغاة']],f.st,"setF.bind(null,'po','st')")}${SEARCH('t-po')}</div></div>`+T(['التاريخ','المورد','الخامات','الإجمالي','المدفوع','المتبقي','ميعاد السداد','التسليم','الحالة',''],rowsHtml,{id:'t-po',empty:'لا توجد أوامر شراء لهذا المشروع'}),PRINTBTNS('مشتريات الخامات','t-po'))}
  ${C('إجمالي كل مورد في المشروع ده',T(['المورد','عدد الأوامر','الإجمالي','المدفوع','المتبقي'],Object.values(bySup).map(o=>TR([esc(o.name),o.n,fmt(o.amt),fmt(o.paid),`<span class="n ${o.rem>0.01?'neg':''}">${fmt(o.rem)}</span>`])),{empty:'لا توجد بيانات'}))}`;
};

async function savePurchaseOrder(projectId){return once('po',async()=>{
  const h=gf('f-po');if(!h)return;
  const proj=V.projects.find(p=>p.id===projectId);if(!proj)return;
  const lines=[...document.querySelectorAll('#po-lines .lrow')].map(r=>({name:r.querySelector('.l-item').value.trim(),qty:num(r.querySelector('.l-qty').value),cost:num(r.querySelector('.l-cost').value)})).filter(l=>l.name||l.qty||l.cost);
  if(!lines.length)return toast('أضف خامة واحدة على الأقل','err');
  const bad=lines.find(l=>!l.name||l.qty<=0||l.cost<0);
  if(bad)return toast('راجع اسم الخامة والعدد والسعر في كل سطر','err');
  const total=Math.round(sum(lines,l=>l.qty*l.cost)*100)/100;
  const dep=num($('f-po-deposit').value);
  if(dep<0||dep>total+0.01)return toast('العربون لازم يكون بين صفر والإجمالي','err');
  const comp=compOf(projectId,h.comp);
  const sup=await ensureSupplier(h.supplier,S.branch);if(!sup)return;
  const invId=newGroup();let done=null,depTxId=null;
  if(dep>0.004){
    const reg=$('f-po-reg').value;if(!reg)return toast('اختر الخزنة اللي دفعت منها العربون','err');
    const fr=readFundRowsFor('f-po',dep,projectId);if(fr.error)return toast(fr.error,'err');

async function undoPOPayment(paymentId,invId){

  if(!await ask('إلغاء الدفعة دي هيعكس حركة الخزنة المرتبطة بيها (لو فيه) ويرجّع المبلغ للمتبقي على أمر الشراء. متأكد؟',{danger:true,ok:'إلغاء الدفعة'}))return;

}

async function cancelPO(invId){
  const inv=await Q1(sb.from('supplier_invoices').select('*').eq('id',invId).single());if(!inv||inv.is_cancelled)return;
  if(!await ask('هيتم إلغاء أمر الشراء بالكامل: عكس كل الدفعات، إلغاء تكلفة المشروع، إلغاء أي التزامات تمويل مرتبطة، وإلغاء بنود الخامات. متأكد؟',{danger:true,ok:'إلغاء أمر الشراء'}))return;
  const txs=await Q(sb.from('cash_transactions').select('id,is_reversed,reversal_of').eq('related_table','supplier_invoices').eq('related_id',invId));
  for(const t of txs)if(!t.is_reversed&&!t.reversal_of)await reverseCashTx(t.id);
  await sb.from('supplier_payments').update({is_cancelled:true}).eq('invoice_id',invId);
  const mats=await Q(sb.from('solar_outside_materials').select('id,cost_id').eq('supplier_invoice_id',invId));
  const costIds=[...new Set(mats.map(m=>m.cost_id).filter(Boolean))];
  const txIds=txs.map(t=>t.id);
  const pfByTx=txIds.length?await inChunks(ids=>sb.from('project_funding').select('id,obligation_id').in('cash_tx_id',ids),txIds):[];
  const pfByCost=costIds.length?await inChunks(ids=>sb.from('project_funding').select('id,obligation_id').in('cost_id',ids),costIds):[];
  const pfAll=[...pfByTx,...pfByCost].filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i);
  for(const x of pfAll){if(x.obligation_id)await sb.from('fund_obligations').update({is_cancelled:true}).eq('id',x.obligation_id);await sb.from('project_funding').update({is_cancelled:true}).eq('id',x.id);}
  for(const cid of costIds)await sb.from('solar_project_costs').update({is_cancelled:true}).eq('id',cid);
  await sb.from('solar_outside_materials').update({is_cancelled:true}).eq('supplier_invoice_id',invId);
  await sb.from('supplier_invoices').update({is_cancelled:true}).eq('id',invId);
  await logAudit('supplier_invoices','cancel',invId,inv);toast('تم إلغاء أمر الشراء','ok');refresh();
}

async function partnerCalc(){
  const [ps,bp,pw,hold]=await Promise.all([Q(sb.from('v_partner_summary').select('*')),Q(sb.from('v_branch_profit').select('*')),Q(sb.from('v_profit_withdrawn').select('*')),Q(sb.from('company_profit_holdings').select('amount').eq('is_cancelled',false))]);
  const acc=sum(bp,'profit'),holdings=sum(hold,'amount'),gross=acc+sum(pw,'via_cash')+holdings;
  const rows=ps.map(p=>{const adv=num(p.advances)-num(p.advance_repaid),cap=num(p.contributions)-num(p.capital_withdrawals)-adv,share=gross*num(p.current_percentage)/100;return {...p,adv,cap,share,left:share-num(p.profit_withdrawn)};});
  return {rows,acc,gross,holdings,viaCash:sum(pw,'via_cash')};
}
async function profitBreakdown(){

  const tin=sum(Object.values(by),'i'),tout=sum(Object.values(by),'o');
  return C('من أين جه رقم المكسب؟ — مطابقة',`<p class="note" style="margin:0 0 10px">رقم "المكسب المتراكم" بيتحسب من حركات الخزائن اللي متعلّم عليها "مكسب" (داخل − خارج)، مش من (سعر البيع − التكلفة). لو فيه بند هنا مش منطقي (مثلًا تحصيل دفعات مشروع كلها داخلة مكسب، أو مشتريات خارجة من رأس المال)، ده سبب الغلط.</p>`
    +T(['البند','داخل مكسب','خارج مكسب','الصافي'],[...rows,...(rows.length?[TR(['الإجمالي',fmt(tin),fmt(tout),signed(tin-tout)],'tot')]:[])],{empty:'لا توجد حركات مكسب'})
    +`<div class="kpis" style="margin-top:14px">${K('ربح المبيعات (سعر − تكلفة)',fmt(sum(sm,'total_profit')),'a','فواتير + بيع سريع')}${K('صافي ربح المشاريع (محصّل − تكاليف)',fmt(sum(sol,'net_profit')),'a')}${K('المجموع حسب الحسابات',fmt(sum(sm,'total_profit')+sum(sol,'net_profit')),'g','قبل المصاريف والتالف')}</div>`,`<button class="btn ghost sm" onclick="reclassifyProjectMoney()">إعادة تصنيف فلوس المشاريع القديمة (من مكسب لفلوس شغل)</button><button class=\"btn danger sm\" onclick=\"resetProfit()\">تصفير المكسب المتراكم (بداية جديدة)</button>`);
}

/* توزيع سداد السلف على أقدم سلفة الأول */
function openAdvances(rows){
  const out=[];const pids=[...new Set(rows.map(r=>r.partner_id))];
  for(const pid of pids){
    let rep=sum(rows.filter(r=>r.partner_id===pid&&r.kind==='repayment'),'amount');
    for(const a of rows.filter(r=>r.partner_id===pid&&r.kind==='advance')){
      const pay=Math.min(rep,num(a.amount));rep-=pay;const rem=num(a.amount)-pay;
      if(rem>0.01)out.push({...a,paid:pay,rem});
    }
  }
  return out.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
}

/* ضبط رأس مال شريك للرقم الصح (بعد تجارب مثلًا) */
async function adjustPartnerCapital(pid){
  const p=await Q1(sb.from('v_partner_summary').select('*').eq('partner_id',pid).maybeSingle());if(!p)return;
  const net=num(p.contributions)-num(p.capital_withdrawals),adv=num(p.advances)-num(p.advance_repaid);
  const old=await Q(sb.from('partner_capital_movements').select('*').eq('partner_id',pid).in('type',['contribution','withdrawal_capital']));
  const v=await askForm('ضبط رأس مال '+esc(p.name),[
    {k:'target',l:'رأس المال الصحيح (قبل خصم السلف)',t:'number',v:net,req:1,w:'wide'},{k:'date',l:'تاريخ التسوية',t:'date',v:todayStr(),req:1},
    {k:'reset',l:`ابدأ من الصفر: امسح حركات رأس المال القديمة (${old.length} حركة إيداع/سحب) قبل الضبط`,t:'check',w:'wide'},{k:'notes',l:'ملاحظات',w:'wide'}],
    {ok:'ضبط الرصيد',note:`الحالي: إيداعات − سحب رأس مال = <b>${fmt(net)}</b> | سلف مفتوحة = <b>${fmt(adv)}</b> | رصيد رأس المال بعد السلف = <b>${fmt(net-adv)}</b>.<br>اكتب رأس المال الصحيح، والنظام هيسجّل حركة تسوية بالفرق (من غير أي خزنة). السلف مش بتتأثر — بتفضل بتتخصم من الرصيد.<br>لو علّمت "ابدأ من الصفر" بيتمسح الإيداعات وسحوبات رأس المال القديمة (وتتعكس حركات الخزنة المرتبطة بيها لو فيه)، ويتسجّل الرقم الصح كإيداع واحد. سحب المكسب ما بيتمسحش.`});
  if(!v)return;
  await once('adjcap',async()=>{
    let base=net;
    if(v.reset){
      for(const m of old){
        if(m.cash_transaction_id){const c=await Q1(sb.from('cash_transactions').select('is_reversed,reversal_of').eq('id',m.cash_transaction_id).maybeSingle());if(c&&!c.is_reversed&&!c.reversal_of)await reverseCashTx(m.cash_transaction_id);}
        const r=await sb.from('partner_capital_movements').delete().eq('id',m.id).select();
        if(r.error||!r.data?.length)return toast(r.error?('تعذّر مسح حركة: '+r.error.message):'لم تُمسح الحركة — صلاحيات الحذف (RLS)، شغّل ملف alahd-delete-permissions.sql','err');
        await logAudit('partner_capital_movements','delete',m.id,m);
      }
      base=0;
    }
    const diff=Math.round((num(v.target)-base)*100)/100;
    if(Math.abs(diff)<0.01){toast(v.reset?'تم مسح الحركات القديمة':'رأس المال مضبوط بالفعل','ok');return refresh();}
    if(await M(sb.from('partner_capital_movements').insert({partner_id:pid,branch_id:S.branch,type:diff>0?'contribution':'withdrawal_capital',amount:Math.abs(diff),date:v.date,notes:'تسوية لضبط رأس المال'+(v.notes?' — '+v.notes:'')}),`تم ضبط رأس مال ${p.name}`))refresh();
  });
}

async function deletePartnerMove(tbl,id,pid){

}

async function loadTakings(ids,from,to){
  const inB=q=>q.in('branch_id',ids),rows=[];const okd=d=>d&&(!from||d>=from)&&(!to||d<=to);
  const [pcm,adv,pw,pay,att,cash]=await Promise.all([
    Q(inB(sb.from('partner_capital_movements').select('*').in('type',['withdrawal_capital','withdrawal_profit']).eq('is_cancelled',false))),
    Q(inB(sb.from('partner_advances').select('*').eq('kind','advance').eq('is_cancelled',false))),
    Q(inB(sb.from('profit_withdrawals').select('*').eq('is_cancelled',false))),
    Q(sb.from('payroll_entries').select('month,advances,employees!inner(name,branch_id)').gt('advances',0).eq('is_cancelled',false).in('employees.branch_id',ids)),
    Q(inB(sb.from('daily_attendance').select('date,advance_amount,branch_id,daily_workers(name)').eq('is_cancelled',false).gt('advance_amount',0))),
    Q(inB(sb.from('cash_transactions').select('id,date,amount,notes,branch_id').eq('category','partner_withdrawal').eq('direction','out').eq('is_reversed',false).is('reversal_of',null)))
  ]);
  const used=new Set([...pcm,...adv,...pw].map(x=>x.cash_transaction_id).filter(Boolean));
  pcm.forEach(m=>rows.push({date:m.date,name:pname(m.partner_id),type:CAP_TYPES[m.type],branch:m.branch_id,source:m.notes||'حركة رأس مال',amount:num(m.amount)}));
  adv.forEach(m=>rows.push({date:m.date,name:pname(m.partner_id),type:'سلفة شريك',branch:m.branch_id,source:m.notes||'سلف الشركاء',amount:num(m.amount)}));
  pw.forEach(w=>rows.push({date:w.date,name:w.partner_id?pname(w.partner_id):'(شريك غير محدد)',type:'سحب مكسب من مصدر',branch:w.branch_id,source:w.source_table==='sales_invoices'?'فاتورة بيع':'مشروع شمسي',amount:num(w.amount)}));
  pay.forEach(p=>rows.push({date:p.month,name:p.employees?.name||'-',type:'سلفة موظف (في الراتب)',branch:p.employees?.branch_id,source:'الرواتب',amount:num(p.advances)}));
  att.forEach(a=>rows.push({date:a.date,name:a.daily_workers?.name||'-',type:'سلفة عامل يومية',branch:a.branch_id,source:'عمالة باليومية',amount:num(a.advance_amount)}));
  cash.filter(t=>!used.has(t.id)).forEach(t=>rows.push({date:t.date,name:t.notes||'(راجع الملاحظات)',type:'سحب نقدي (حركة يومية)',branch:t.branch_id,source:'الحركة اليومية',amount:num(t.amount)}));
  return rows.filter(r=>okd(String(r.date).slice(0,10))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

async function exportAllData(){
  if(typeof XLSX==='undefined')return toast('مكتبة Excel لم تُحمَّل','err');const wb=XLSX.utils.book_new();let n=0;
  for(const t of EXPORT_TABLES){
    $('exp-status').textContent='جاري تصدير '+t+'…';let all=[];
    for(let from=0;from<50000;from+=1000){const {data,error}=await sb.from(t).select('*').range(from,from+999);if(error||!data)break;all=all.concat(data);if(data.length<1000)break;}
    if(!all.length)continue;
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(all.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v!==null&&typeof v==='object'?JSON.stringify(v):v])))),t.slice(0,31));n++;
  }
  $('exp-status').textContent='';if(!n)return toast('لا توجد بيانات لتصديرها','err');XLSX.writeFile(wb,'بيانات_العهد_'+todayStr()+'.xlsx');toast('تم التصدير','ok');
}

async function returnFunds(id){
  const [o,regs]=await Promise.all([Q1(sb.from('fund_obligations').select('*').eq('id',id).single()),L.regs()]);if(!o)return;
  const rem=oRem(o);await L.partners();
  const v=await askForm('رجّعنا فلوس — '+esc(o.ref_label||OKIND[o.kind]),[
    {k:'amount',l:'المبلغ اللي رجع',t:'number',v:rem,req:1,hint:`المتبقي ${fmt(rem)}`},{k:'date',l:'التاريخ',t:'date',v:todayStr(),req:1},
    {k:'via',l:'رجعت منين؟',t:'select',opts:[['cash','من خزنة (فلوس)'],['partner','من شريك'],['loan','من سلفة'],['goods','من بضاعة'],['other','مصدر تاني']],w:'w2'},
    {k:'vpartner',l:'الشريك (لو من شريك)',t:'select',opts:[['','— اختر —'],...S.partners.filter(p=>p.active!==false).map(p=>[p.id,p.name])]},
    {k:'reg',l:'الخزنة (لو فيه حركة فلوس)',t:'select',opts:regOpts(regs,{none:'— بدون حركة خزنة —'}),hint:'من خزنة: بتخرج منها (للشريك أو المصدر). من شريك: بتدخلها.'},
    {k:'notes',l:'ملاحظات',w:'wide'}],{ok:'تسجيل',check:v=>v.amount<=0?'اكتب مبلغًا صحيحًا':v.amount>rem+0.01?`أكبر من المتبقي (${fmt(rem)})`:(v.via==='partner'&&!v.vpartner?'اختر الشريك':null)});
  if(!v)return;
  await once('retf',async()=>{
    const viaLabel={cash:'من خزنة',partner:'من شريك '+(v.vpartner?pname(v.vpartner):''),loan:'من سلفة',goods:'من بضاعة',other:'مصدر تاني'}[v.via]+(v.notes?' — '+v.notes:'');
    if(v.via==='cash'&&v.reg&&o.kind!=='project'){const r=await createCashTx({branch_id:o.branch_id,register_id:v.reg,date:v.date,direction:'out',category:'other',source_type:'capital',amount:v.amount,notes:'سداد التزام: '+(o.ref_label||'')});if(!r.data)return;}
    if(v.via==='partner'){
      if(v.reg){const r=await createCashTx({branch_id:o.branch_id,register_id:v.reg,date:v.date,direction:'in',category:'other',source_type:'capital',amount:v.amount,notes:'فلوس من الشريك '+pname(v.vpartner)+' لسداد التزام'});if(!r.data)return;}
      await addObligation({branch_id:o.branch_id,kind:'partner',ref_id:v.vpartner,ref_label:pname(v.vpartner),amount:v.amount,reason:'سداد التزام: '+(o.ref_label||'')+(o.reason?' — '+o.reason:''),date:v.date});
    }
    const nr=num(o.returned)+v.amount;
    if(await M(sb.from('fund_obligations').update({returned:nr,returned_via:((o.returned_via?o.returned_via+' | ':'')+viaLabel),returned_date:v.date}).eq('id',id),'تم تسجيل الرد'))refresh();
  });
}

  return `<div class="kpis">${K('إيراد الشهر (بيع سريع وخدمات)',fmt(sum(thisM,'amount')),'a')}${K('مكسب الشهر',fmt(sum(thisM,r=>num(r.amount)-num(r.cost))),'g')}${K('لسه ماتحصّلش',fmt(sum(ok,rem)),'r')}</div>
  ${C('تسجيل بيعة سريعة',formHtml('f-qs',fields,'تسجيل','saveQuickSale')+`<div class="totline"><div class="mut">المكسب = المبلغ − التكلفة = <b id="qs-profit">0.00</b></div></div><p class="note">للصيانة والتركيب والبيع من برا والخدمات السريعة اللي مش من المخزن. الفلوس اللي بتدخل بتتقسم: التكلفة رأس مال والباقي مكسب. لو حددت مورد معيّن، التكلفة دي هتتحسب في رصيده جوه "المشتريات والموردين ← كشف حساب" عشان تعرف تدفعله بعدين. لو العميل دفع جزء، الباقي بيتسجّل عليه في "العملاء والآجل".</p>`)}
  ${C('السجل',`<div class="toolbar"><div class="left">${chips([['all','الكل'],...Object.entries(QK)],f.k,"setF.bind(null,'qs','k')")}${SEARCH('t-qs')}</div></div>`+T(['التاريخ','النوع','البيان','العميل','المورد','المبلغ','التكلفة','المكسب','متبقي','',''],shown.map(r=>TR([fdate(r.date),tag(QK[r.kind]||r.kind,r.kind==='outside'?'p':'a'),`<b>${esc(r.description)}</b><div class="mut">${esc(r.notes||'')}</div>`,esc(cn[r.customer_id]||'-'),esc(sn[r.supplier_id]||'-'),`<span class="n">${fmt(r.amount)}</span>`,fmt(r.cost),`<span class="n pos">${fmt(num(r.amount)-num(r.cost))}</span>`,`<span class="n ${rem(r)>0.01?'neg':''}">${fmt(rem(r))}</span>`,(!r.is_cancelled&&rem(r)>0.01&&r.customer_id?B('تحصيل',`collectDialog('${r.customer_id}','${r.receivable_id||''}')`,'ok'):''),r.is_cancelled?tag('ملغاة','r'):B('إلغاء وعكس الأثر',`cancelQuickSale('${r.id}')`)],r.is_cancelled?'dim':'')),{id:'t-qs',empty:'لا توجد بيعات سريعة'}),PRINTBTNS('بيعات سريعة وخدمات','t-qs'))}`;
};
R['sales.quick']=async()=>{
  const f=F('qmode',{m:'quick'});
  const bar=`<div class="toolbar"><div class="left">${chips([['quick','بيعة سريعة / خدمة (صيانة، تركيب، أي شغلانة)'],['ext','طلبية من برا (اشتريت بضاعة مخصوص وبعتها)']],f.m,"setF.bind(null,'qmode','m')")}</div></div>`;
  return bar+await (f.m==='ext'?R['sales.external']():salesQuickInner());
};
async function saveQuickSale(){return once('qs',async()=>{
  const h=gf('f-qs');if(!h||!S.branch)return;const amount=num(h.amount),cost=num(h.cost),paid=h.paid==null?amount:num(h.paid);
  if(amount<=0)return toast('اكتب المبلغ','err');if(paid<0||paid>amount+0.005)return toast('المدفوع لازم يكون بين صفر والمبلغ','err');
  if(amount-paid>0.005&&!h.customer)return toast('لو فيه متبقي على العميل لازم تختار عميل','err');
  if(paid>0&&!h.reg)return toast('اختر الخزنة اللي دخلت فيها الفلوس','err');
  const id=newGroup(),ratio=Math.min(1,Math.max(0,cost/amount));let recId=null,txId=null;
  if(paid>0){const x=await saleCashIn({branch:S.branch,register:h.reg,date:h.date,amount:paid,ratio,notes:`${QK[h.kind]} — ${h.desc}`,related_table:'quick_sales',related_id:id});if(!x.ok)return;txId=x.ids[0]||null;}
  if(amount-paid>0.005){
    const r=await M(sb.from('receivables').insert({customer_id:h.customer,branch_id:S.branch,amount:amount-paid,original_amount:amount,cost_ratio:ratio,due_date:h.due||null,debt_date:h.date,notes:`${QK[h.kind]} — ${h.desc}`,status:paid>0?'partially_collected':'open'}).select().single());
    if(!r)return;recId=r.id;await sb.from('receivable_items').insert({receivable_id:r.id,item_name:h.desc,quantity:1,unit_price:amount});
    if(paid>0&&txId)await sb.from('receivable_collections').insert({receivable_id:r.id,amount:paid,cash_transaction_id:txId,date:h.date});
  }
  if(await M(sb.from('quick_sales').insert({id,branch_id:S.branch,kind:h.kind,description:h.desc,customer_id:h.customer||null,supplier_id:h.supplier||null,amount,cost,paid_now:paid,receivable_id:recId,cash_tx_id:txId,date:h.date,notes:h.notes||null}),'تم تسجيل البيعة'))refresh();
});}
async function cancelQuickSale(id){
  const r=await Q1(sb.from('quick_sales').select('*').eq('id',id).single());if(!r||r.is_cancelled)return;
  if(r.receivable_id){const c=await Q(sb.from('receivable_collections').select('id,cash_transaction_id').eq('receivable_id',r.receivable_id));const later=c.filter(x=>x.cash_transaction_id!==r.cash_tx_id);if(later.length)return toast('العميل دفع دفعات بعد كده — تراجع عنها من كشف حسابه الأول','err');}
  if(!await ask('هيتلغي البيع وتتعكس حركات الخزنة والدين المرتبط. متأكد؟',{danger:true,ok:'إلغاء وعكس الأثر'}))return;
  const txs=await Q(sb.from('cash_transactions').select('id,is_reversed,reversal_of').eq('related_table','quick_sales').eq('related_id',id));
  for(const t of txs)if(!t.is_reversed&&!t.reversal_of)await reverseCashTx(t.id);
  if(r.receivable_id){await sb.from('receivable_collections').delete().eq('receivable_id',r.receivable_id);await sb.from('receivables').update({is_cancelled:true}).eq('id',r.receivable_id);}
  await sb.from('quick_sales').update({is_cancelled:true}).eq('id',id);await logAudit('quick_sales','cancel',id,r);toast('تم الإلغاء','ok');refresh();
}

/* =====================  عجز وجرد الخزنة  ===================== */
function defCalc(){
  const reg=$('f-df-reg').value,a=$('f-df-actual').value;if(a==='')return;
  const diff=num(a)-num((V.regBal||{})[reg]);$('f-df-kind').value=diff<0?'deficit':'surplus';$('f-df-amount').value=Math.abs(diff).toFixed(2);
}
R['treasury.deficit']=async()=>{
  const [regs,bal,rows]=await Promise.all([L.regs(),Q(sb.from('v_register_balances').select('register_id,balance').eq('branch_id',S.branch)),Q(sb.from('cash_transactions').select('*, cash_registers(name)').eq('branch_id',S.branch).eq('category','cash_adjustment').order('date',{ascending:false}).limit(150))]);
  V.regBal=Object.fromEntries(bal.map(b=>[b.register_id,num(b.balance)]));
  const fields=[{k:'reg',l:'الخزنة',t:'select',opts:regs.filter(r=>r.active!==false).map(r=>[r.id,`${r.name} — الرصيد في النظام ${fmt(V.regBal[r.id])}`]),req:1,on:'defCalc()',w:'w2'},
    {k:'actual',l:'الفلوس الفعلية اللي عديتها (اختياري)',t:'number',on:'defCalc()',hint:'اكتبها والنظام يحسب العجز أو الزيادة'},
    {k:'kind',l:'النوع',t:'select',opts:[['deficit','عجز (ناقص فلوس)'],['surplus','زيادة']]},{k:'amount',l:'المبلغ',t:'number',req:1},
    {k:'src',l:'يتحسب من',t:'select',opts:[['profit','مكسب (صافي ربح بس)'],['capital','فلوس شغل / عهدة (مش مكسب)']]},{k:'date',l:'التاريخ',t:'date',v:todayStr(),req:1},{k:'who',l:'السبب / على مين',w:'w2',ph:'مثلًا: عجز جرد آخر اليوم — أمين الخزنة'}];
  const live=rows.filter(t=>!t.is_reversed&&!t.reversal_of),mo=monthNow();
  const def=live.filter(t=>t.direction==='out'),sur=live.filter(t=>t.direction==='in');
  return `<div class="kpis">${K('عجز الشهر',fmt(sum(def.filter(t=>String(t.date).slice(0,7)===mo),'amount')),'r')}${K('إجمالي العجز',fmt(sum(def,'amount')),'r')}${K('إجمالي الزيادة',fmt(sum(sur,'amount')),'g')}</div>
  ${C('تسجيل عجز أو زيادة في الخزنة',formHtml('f-df',fields,'تسجيل','saveDeficit')+`<p class="note">لو الفلوس الفعلية في الخزنة أقل من رصيد النظام، سجّل عجز بالفرق: بيتخصم من رصيد الخزنة ويتحسب خسارة من المكسب (أو رأس المال لو اخترت). الزيادة بتدخل الخزنة. اكتب الفلوس الفعلية اللي عديتها والنظام يحسب الفرق لوحده.</p>`)}
  ${C('سجل العجز والتسويات',T(['التاريخ','الخزنة','النوع','المبلغ','يتحسب من','السبب',''],rows.map(t=>{const d=t.is_reversed||t.reversal_of;return TR([fdate(t.date),esc(t.cash_registers?.name||'-'),t.direction==='out'?tag('عجز','r'):tag('زيادة','g'),`<span class="n">${fmt(t.amount)}</span>`,t.source_type==='capital'?tag('رأس مال','a'):tag('مكسب'),`<span class="mut">${esc(t.notes||'')}</span>`,!d?B('عكس',`reverseTx('${t.id}')`):''],d?'dim':'');}),{id:'t-df',empty:'لا يوجد عجز مسجّل'}),PRINTBTNS('العجز','t-df'))}`;
};
async function saveDeficit(){return once('df',async()=>{
  const h=gf('f-df');if(!h)return;if(h.amount<=0)return toast('اكتب المبلغ','err');
  const {error}=await createCashTx({branch_id:S.branch,register_id:h.reg,date:h.date,direction:h.kind==='deficit'?'out':'in',category:'cash_adjustment',source_type:h.src,amount:h.amount,notes:`${h.kind==='deficit'?'عجز':'زيادة'} خزنة${h.who?' — '+h.who:''}`});
  if(!error){toast('تم التسجيل','ok');refresh();}
});}
/* =====================  حركة الأموال: كل حساب فلوس  ===================== */
async function cpNames(rows){
  const by={};rows.forEach(r=>{if(r.related_table&&r.related_id)(by[r.related_table]||(by[r.related_table]=new Set())).add(r.related_id);});
  const map={};
  const get=async(t,sel,fn)=>{const ids=[...(by[t]||[])];if(!ids.length)return;(await inChunks(x=>sb.from(t).select(sel).in('id',x),ids)).forEach(d=>{map[t+':'+d.id]=fn(d);});};
  await Promise.all([get('sales_invoices','id,customers(name)',d=>d.customers?.name),get('supplier_invoices','id,suppliers(name)',d=>d.suppliers?.name),get('receivables','id,customers(name)',d=>d.customers?.name)]);
  return map;
}
const RTYPE={cash:'نقدية',bank:'بنك',wallet:'محفظة'};
R.flow=async()=>{
  const f=F('flow',{scope:'cur',reg:'all',from:addDays(todayStr(),-30),dir:'all'});
  const ids=f.scope==='all'?allIds():[S.branch];
  const regs=await Q(sb.from('v_register_balances').select('*').in('branch_id',ids).eq('active',true).order('name'));
  if(f.reg!=='all'&&!regs.find(r=>r.register_id===f.reg))f.reg='all';
  let q=sb.from('v_cash_effective').select('*').in('branch_id',ids).order('date',{ascending:false}).limit(1000);
  if(f.reg!=='all')q=q.eq('register_id',f.reg);if(f.from)q=q.gte('date',f.from);if(f.dir!=='all')q=q.eq('direction',f.dir);
  const rows=await Q(q);const cp=await cpNames(rows);
  const sel=regs.find(r=>r.register_id===f.reg),runs={};
  if(sel&&f.dir==='all'){let cur=num(sel.balance);rows.forEach(r=>{runs[r.id]=cur;cur-=r.direction==='in'?num(r.amount):-num(r.amount);});}
  const rn=Object.fromEntries(regs.map(r=>[r.register_id,r.name]));
  const inn=sum(rows.filter(r=>r.direction==='in'),'amount'),out=sum(rows.filter(r=>r.direction==='out'),'amount');
  const byItem={};rows.filter(r=>r.direction==='out').forEach(r=>{const k=r.expense_item||CATS[r.category]||r.category;byItem[k]=(byItem[k]||0)+num(r.amount);});
  const items=Object.entries(byItem).sort((a,b)=>b[1]-a[1]).slice(0,15);
  const who=r=>{const n=cp[r.related_table+':'+r.related_id];return n?`${r.direction==='in'?'من':'إلى'}: <b>${esc(n)}</b>`:'<span class="mut">—</span>';};
  const card=(id,title,sub,val,on)=>`<button type="button" class="card" style="text-align:right;cursor:pointer;margin:0;${on?'border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);':''}" onclick="setF('flow','reg','${id}')"><div class="mut">${sub}</div><div style="font-weight:700;font-size:15px">${title}</div><div class="n" style="font-size:19px;margin-top:4px">${val}</div></button>`;
  return `<div class="toolbar"><div class="left">${chips([['cur','الفرع الحالي'],['all','كل الفروع']],f.scope,"setF.bind(null,'flow','scope')")}</div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px">
    ${card('all','كل الحسابات','مجموع '+regs.length+' حساب',fmt(sum(regs,'balance')),f.reg==='all')}
    ${regs.map(r=>card(r.register_id,esc(r.name),`${RTYPE[r.type]||r.type}${f.scope==='all'?' — '+esc(bname(r.branch_id)):''}`,fmt(r.balance),f.reg===r.register_id)).join('')}
  </div>
  <div class="kpis">${K('داخل (الفترة)',fmt(inn),'g')}${K('خارج (الفترة)',fmt(out),'r')}${K('الصافي',fmt(inn-out),inn>=out?'g':'r')}${sel?K('رأس مال / مكسب في الحساب',`${fmt(sel.capital_balance)} / ${fmt(sel.profit_balance)}`,'a'):''}</div>
  ${C(sel?'حركة: '+esc(sel.name):'حركة كل الحسابات',`<div class="toolbar"><div class="left"><label class="mut">من تاريخ</label><input type="date" value="${f.from}" onchange="setF('flow','from',this.value)" style="width:auto">${chips([['all','الكل'],['in','داخل'],['out','خارج']],f.dir,"setF.bind(null,'flow','dir')")}${SEARCH('t-flow')}</div></div>`
  +T(['التاريخ',...(sel?[]:['الحساب']),'داخل','خارج','البند / التصنيف','مع مين','ملاحظات',...(sel&&f.dir==='all'?['الرصيد بعد الحركة']:[])],rows.map(r=>TR([fdate(r.date),...(sel?[]:[esc(rn[r.register_id]||'-')]),r.direction==='in'?`<span class="n pos">${fmt(r.amount)}</span>`:'-',r.direction==='out'?`<span class="n neg">${fmt(r.amount)}</span>`:'-',`${esc(CATS[r.category]||r.category)}${r.expense_item?` <span class="tag p">${esc(r.expense_item)}</span>`:''} ${r.source_type==='capital'?tag('رأس مال','a'):tag('مكسب')}`,who(r),`<span class="mut">${esc(r.notes||'')}</span>`,...(sel&&f.dir==='all'?[`<span class="bal">${fmt(runs[r.id])}</span>`]:[])])),{id:'t-flow',empty:'مفيش حركات في الفترة دي'}),PRINTBTNS('حركة الأموال','t-flow'))}
  ${C('المصروفات حسب البند (الفترة دي)',T(['البند','الإجمالي','النسبة'],items.map(([k,v])=>TR([esc(k),`<span class="n">${fmt(v)}</span>`,out>0?Math.round(v/out*100)+'%':'-'])),{empty:'مفيش مصروفات'}))}
  <p class="note">كل حاجة بتحرّك فلوس في النظام (بيع، تحصيل، دفع مورد، مصروف، سلفة، سحب...) بتظهر هنا. لو عايز تضيف حساب جديد (فودافون كاش، إنستا باي، محفظة شريك...) من "الخزائن والحركة ← الخزائن والبنوك" واختار النوع "محفظة إلكترونية". ولتحديد بند مصروف (أكل وشرب، انتقالات...) اكتبه في "بند المصروف" وقت تسجيل الحركة.</p>`;
};
