<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العهد للطاقة الشمسية — نظام الحسابات</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1A1B1E; --paper:#F0F1EE; --card:#FFFFFF; --line:#DFE1DB; --line2:#ECEDE8; --muted:#686B66;
  --gold:#F2A93B; --gold-d:#B97612; --orange:#E8720C; --green:#1F6F4A; --green-s:#E2F0E8;
  --red:#B0382C; --red-s:#F9E4E0; --amber-s:#FCEFD6; --plum:#5F4B8B; --plum-s:#ECE7F5;
  --side:#18191C; --side-2:#232529; --input:#FFFFFF; --hover:#F6F7F4;
}
html[data-theme="dark"]{
  --ink:#ECEBE6; --paper:#111215; --card:#1A1B1F; --line:#2E3036; --line2:#25272C; --muted:#9A9CA2;
  --green:#4FB57F; --green-s:#173026; --red:#E27A6C; --red-s:#3A1F1C; --amber-s:#3A2E14; --plum:#A992DC; --plum-s:#2A2438;
  --side:#0C0D0F; --side-2:#17181B; --input:#23252A; --hover:#202227; --gold-d:#F2A93B;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;}
body.noscroll{overflow:hidden;}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit;}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
h1,h2,h3{margin:0;font-weight:700;}
.hide{display:none!important;}
a{color:var(--green);}

/* ---------- الشاشات الكاملة (دخول / خطأ) ---------- */
.fullscreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side);padding:20px;}
.login-box{width:400px;max-width:100%;background:var(--card);border-radius:14px;padding:34px 34px 28px;border-top:4px solid var(--gold);}
.login-box img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 8px;}
.login-box h1{font-size:22px;text-align:center;}
.login-box .sub{text-align:center;color:var(--muted);font-size:12.5px;margin:4px 0 22px;}
.login-box .fld{margin-bottom:14px;}
.login-box .btn{width:100%;justify-content:center;padding:10px;}
.errline{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;}

/* ---------- الهيكل ---------- */
#app{display:flex;min-height:100vh;}
.side{width:248px;flex-shrink:0;background:var(--side);color:#D9D8D2;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:18px 12px 14px;}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand img{width:40px;height:40px;object-fit:contain;}
.brand b{display:block;font-size:17px;color:#fff;line-height:1.2;}
.brand span{font-size:10.5px;color:var(--gold);letter-spacing:.02em;}
.branchbox{margin:14px 4px 6px;padding:10px 11px;background:var(--side-2);border-radius:8px;border-right:3px solid var(--gold);}
.branchbox label{display:block;font-size:11px;color:#9a9b96;margin-bottom:4px;}
.branchbox select{width:100%;background:transparent;border:0;color:#fff;font-weight:600;font-size:14px;padding:0;cursor:pointer;}
.branchbox select option{color:#111;}
.grp{font-size:11px;color:#7f807b;margin:16px 10px 4px;}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#C9C8C1;cursor:pointer;font-size:14px;border:0;background:none;width:100%;text-align:right;}
.nav svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
.nav:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav.active{background:rgba(242,169,59,.14);color:#fff;box-shadow:inset -3px 0 0 var(--gold);}
.nav.active svg{stroke:var(--gold);opacity:1;}
.side-foot{margin-top:auto;padding:14px 6px 0;font-size:12px;color:#8f908b;border-top:1px solid rgba(255,255,255,.08);}
.side-foot .em{direction:ltr;text-align:right;word-break:break-all;margin-bottom:8px;}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.2);color:#cfcec8;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;margin-left:6px;}
.side-foot button:hover{border-color:var(--gold);color:#fff;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.mobbar{display:none;}
.head{padding:22px 32px 0;background:var(--paper);}
.head .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.head h1{font-size:26px;letter-spacing:-.01em;}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px;}
.tabs{display:flex;gap:2px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:9px 16px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--gold);}
#view{padding:22px 32px 60px;max-width:1500px;width:100%;}
.loading{padding:60px;text-align:center;color:var(--muted);}
#view.busy{opacity:.45;pointer-events:none;transition:opacity .15s;cursor:progress;}
.kv,.big{direction:ltr;text-align:right;}
.n,.bal,.ledger .sum b{direction:ltr;unicode-bidi:isolate;display:inline-block;}

/* ---------- مكونات ---------- */
.banner{background:var(--amber-s);border:1px solid var(--gold);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13.5px;}
.banner b{color:var(--gold-d);}
.banner code{direction:ltr;display:inline-block;background:rgba(0,0,0,.06);padding:0 6px;border-radius:4px;font-size:12px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:10px;padding:13px 16px 12px;}
.kpi .kl{font-size:12.5px;color:var(--muted);}
.kpi .kv{font-size:24px;font-weight:700;margin-top:3px;letter-spacing:-.01em;}
.kpi .ks{font-size:12px;color:var(--muted);margin-top:2px;}
.kpi.g{border-top-color:var(--green);} .kpi.g .kv{color:var(--green);}
.kpi.r{border-top-color:var(--red);} .kpi.r .kv{color:var(--red);}
.kpi.a{border-top-color:var(--gold);}
.kpi.p{border-top-color:var(--plum);}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.card .ch h3{font-size:16px;}
.card .ca{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.card h4{margin:16px 0 8px;font-size:14px;color:var(--muted);font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid2>.card{margin-bottom:0;}
.gap{height:18px;}

/* الميزان: الشريط المميز في الرئيسية */
.balance{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1.1fr;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden;}
.balance .bx{padding:14px 18px;}
.balance .bx .kl{font-size:12.5px;color:var(--muted);}
.balance .bx .kv{font-size:22px;font-weight:700;margin-top:2px;}
.balance .op{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);padding:0 2px;background:var(--hover);}
.balance .bx.tot{background:var(--ink);color:var(--paper);}
.balance .bx.tot .kl{color:var(--paper);opacity:.7;}
.balance .bx.tot .kv{color:var(--gold);}

/* الجداول */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{background:var(--hover);color:var(--muted);font-weight:600;font-size:12.5px;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover td{background:var(--hover);}
tr.late td{background:var(--red-s);}
tr.late td:first-child{box-shadow:inset -3px 0 0 var(--red);}
tr.dim td{opacity:.45;text-decoration:line-through;}
tr.tot td{font-weight:700;background:var(--hover);border-top:2px double var(--line);}
td.empty{text-align:center;color:var(--muted);padding:28px;}
.n{font-weight:600;white-space:nowrap;}
.pos{color:var(--green);} .neg{color:var(--red);} .mut{color:var(--muted);font-size:12.5px;}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:500;background:var(--line2);color:var(--muted);white-space:nowrap;}
.tag.g{background:var(--green-s);color:var(--green);} .tag.r{background:var(--red-s);color:var(--red);}
.tag.a{background:var(--amber-s);color:var(--gold-d);} .tag.p{background:var(--plum-s);color:var(--plum);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:right;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px;}
.pcard:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.06);}
.pcard-ic{font-size:22px;margin-bottom:2px;}
.pcard-name{font-weight:600;font-size:13.5px;line-height:1.3;}
.pcard-sub{font-size:11.5px;color:var(--muted);}
.pcard-cost{font-weight:700;color:var(--gold-d);font-size:14px;margin-top:2px;}
.pcard-qty{font-size:12px;color:var(--muted);}
.pcard-qty.neg{color:var(--red);}

.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 13px;cursor:pointer;font-size:13px;}
.chip:hover{border-color:var(--gold);}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.chip small{opacity:.65;margin-right:4px;}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;}
.toolbar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
input.search{min-width:220px;}

/* الأزرار */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 15px;border-radius:8px;cursor:pointer;font-weight:500;}
.btn:hover{border-color:var(--ink);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1B1E;font-weight:600;}
.btn.gold:hover{background:#e39a2a;}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn.ghost{background:transparent;}
.btn.sm{padding:4px 11px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:default;}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 9px;font-size:12.5px;cursor:pointer;margin:1px;white-space:nowrap;}
.mini:hover{border-color:var(--ink);}
.mini.ok{color:var(--green);border-color:var(--green);} .mini.bad{color:var(--red);border-color:var(--red);}
.mini.gd{color:var(--gold-d);border-color:var(--gold);}

/* النماذج */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px;align-items:end;}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0;}
.fld.wide{grid-column:1/-1;} .fld.w2{grid-column:span 2;}
.fld label{font-size:12.5px;color:var(--muted);}
.fld label i{color:var(--red);font-style:normal;}
.fld small{color:var(--muted);font-size:12px;}
.fld.act{align-self:end;}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;}
input[type=checkbox]{width:auto;}
textarea{resize:vertical;min-height:38px;}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);cursor:pointer;padding:7px 0;}
.lines{border:1px dashed var(--line);border-radius:8px;padding:10px;margin:12px 0;}
.lrow{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr auto;gap:8px;align-items:start;margin-bottom:8px;}
.lrow.two{grid-template-columns:2.2fr 1fr 1fr 1.2fr 1fr auto;}
.lrow .hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px;}
.totline{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;}
.totline .big{font-size:22px;font-weight:700;}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0;}

/* النوافذ */
#modal-root{display:none;}
.mback{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto;}
.modal{background:var(--card);border-radius:12px;width:560px;max-width:100%;border-top:4px solid var(--gold);}
.modal.wide{width:940px;}
.mhead{padding:16px 22px 0;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mhead .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
.mbody{padding:16px 22px;}
.mfoot{padding:12px 22px 18px;display:flex;gap:8px;}
.ask{white-space:pre-line;font-size:14.5px;line-height:1.7;}
#toasts{position:fixed;bottom:18px;left:18px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:13.5px;max-width:380px;opacity:0;transform:translateY(8px);transition:.25s;border-right:4px solid var(--green);}
.toast.err{border-right-color:var(--red);} .toast.show{opacity:1;transform:none;}

/* كشف الحساب — ورقة الدفتر */
.ledger{background:var(--card);}
.ledger .who{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px;}
.ledger .who h2{font-size:20px;}
.ledger .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px;}
.ledger .sum div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;}
.ledger .sum span{display:block;font-size:12px;color:var(--muted);}
.ledger .sum b{font-size:18px;}
.items{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6;}
.bal{font-weight:700;}

@media (max-width:980px){
  #app{flex-direction:column;}
  .mobbar{display:flex;align-items:center;justify-content:space-between;background:var(--side);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:60;}
  .mobbar .brand{border:0;padding:0;} .mobbar .brand img{width:32px;height:32px;}
  .mobbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;font-size:20px;padding:2px 12px;cursor:pointer;}
  .side{position:fixed;right:0;top:0;z-index:100;transform:translateX(100%);transition:transform .25s;width:80vw;max-width:290px;}
  .side.open{transform:none;box-shadow:-6px 0 24px rgba(0,0,0,.35);}
  .sback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;} .sback.open{display:block;}
  .head{padding:16px 14px 0;} .head h1{font-size:21px;}
  #view{padding:16px 14px 50px;}
  .grid2{grid-template-columns:1fr;}
  .balance{grid-template-columns:1fr;} .balance .op{padding:2px;}
  .modal.wide{width:100%;}
  .ledger .sum{grid-template-columns:1fr;}
  .lrow,.lrow.two{grid-template-columns:1fr 1fr;}
  .fld.w2{grid-column:1/-1;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="login-screen" class="fullscreen hide">
  <div class="login-box">
    <img src="assets/logo.png" alt="شعار العهد" onerror="this.style.display='none'">
    <h1>العهد للطاقة الشمسية</h1>
    <div class="sub">نظام الحسابات</div>
    <div class="fld"><label>البريد الإلكتروني</label><input id="login-email" type="email" autocomplete="username"></div>
    <div class="fld"><label>كلمة المرور</label><input id="login-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn gold" onclick="login()">دخول</button>
    <div class="errline" id="login-error"></div>
  </div>
</div>

<div id="fatal-screen" class="fullscreen hide">
  <div class="login-box">
    <h1 style="color:var(--red)">تعذّر الاتصال</h1>
    <div class="sub">تأكد من الإنترنت وحدّث الصفحة</div>
    <div class="errline" id="fatal-error"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="mobbar">
    <div class="brand"><img src="assets/logo.png" alt="" onerror="this.style.display='none'"><b>العهد</b></div>
    <button onclick="toggleSide()" aria-label="القائمة">☰</button>
  </div>
  <div class="sback" id="sback" onclick="toggleSide()"></div>
  <nav class="side" id="side">
    <div class="brand"><img src="assets/logo.png" alt="" onerror="this.style.display='none'"><div><b>العهد</b><span>للطاقة الشمسية</span></div></div>
    <div class="branchbox"><label>الفرع الحالي (للتسجيل والعمليات)</label><select id="branch-select" onchange="onBranchChange()"></select></div>
    <div id="nav"></div>
    <div class="side-foot">
      <div class="em" id="user-email"></div>
      <button onclick="toggleDark()" id="dark-btn">وضع ليلي</button><button onclick="logout()">خروج</button>
    </div>
  </nav>
  <div class="main">
    <div class="head">
      <div class="row"><div><h1 id="page-title"></h1><p id="page-sub"></p></div><div id="page-actions"></div></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   العهد للطاقة الشمسية — نظام الحسابات (النسخة المنظّمة)
   ===================================================================== */
const SUPABASE_URL='https://ljfnpiytrelzrzpekwtj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_jxpYllaHjYLMiwla_hB7Gw_wuRtsb3v';
let sb=null;
const S={branch:null,branches:[],partners:[],page:'dash',tab:null,lastTab:{},scope:'all',tok:0,after:null,f:{},missing:[]};
const V={};      // بيانات الشاشة الحالية (تستخدمها الأزرار)
const R={};      // دوال رسم الشاشات
const FORMS={};  // تعريفات النماذج

/* ---------- أدوات عامة ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0;};
const fmt=n=>num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Math.round(num(n)).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(String(s).slice(0,10)+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const monthNow=()=>todayStr().slice(0,7);
const monthEnd=m=>{const [y,mo]=m.split('-').map(Number);return ymd(new Date(y,mo,0));};
const fdate=d=>{if(!d)return '-';const x=String(d).slice(0,10).split('-');return x.length===3?`${x[2]}/${x[1]}/${x[0]}`:esc(d);};

const newGroup=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});
async function createCashTx({branch_id,register_id,date,direction,category,source_type,amount,notes,related_table,related_id,attachment_url,group_id,expense_item}){
  if(!register_id)return {data:null,error:null};
  const row={branch_id,register_id,date:date||todayStr(),direction,category,source_type:source_type||'profit',amount,notes:notes||null,related_table:related_table||null,related_id:related_id||null,attachment_url:attachment_url||null};
  if(group_id)row.group_id=group_id;
  if(expense_item)row.expense_item=expense_item;
  const res=await sb.from('cash_transactions').insert(row).select().single();
  if(res.error)toast('تعذّر تسجيل حركة الخزنة: '+res.error.message,'err');
  else if(res.data)await logAudit('cash_transactions','insert',res.data.id,res.data);
  return res;
}
async function reverseCashTx(id,inGroup){
  const {data:o,error}=await sb.from('cash_transactions').select('*').eq('id',id).single();
  if(error||!o){toast('تعذّر إيجاد الحركة','err');return false;}
  if(o.is_reversed)return true;
  const {error:e2}=await sb.from('cash_transactions').insert({branch_id:o.branch_id,register_id:o.register_id,date:todayStr(),direction:o.direction==='in'?'out':'in',category:o.category,source_type:o.source_type,amount:o.amount,notes:'حركة عكسية لتصحيح قيد سابق',reversal_of:o.id});
  if(e2){toast('تعذّر تنفيذ العكس (ممكن الفترة مُقفلة): '+e2.message,'err');return false;}
  await sb.from('cash_transactions').update({is_reversed:true}).eq('id',id);
  await logAudit('cash_transactions','reversal',id,o);
  if(o.group_id&&!inGroup){const sibs=await Q(sb.from('cash_transactions').select('id,is_reversed,reversal_of').eq('group_id',o.group_id).neq('id',id));for(const x of sibs)if(!x.is_reversed&&!x.reversal_of)await reverseCashTx(x.id,true);}
  return true;
}

/* --- تقسيم البيع: رأس مال (تكلفة) + مكسب --- */
async function saleCashIn({branch,register,date,amount,ratio=0,notes,related_table,related_id,category='sale'}){
  amount=num(amount);if(amount<=0||!register)return {ids:[],ok:true};
  const cap=Math.round(amount*Math.min(1,Math.max(0,num(ratio)))*100)/100,prof=Math.round((amount-cap)*100)/100,g=newGroup(),ids=[];
  for(const [src,amt,lab] of [['capital',cap,' — استرداد رأس المال'],['profit',prof,cap>0?' — المكسب':'']]){
    if(amt<=0)continue;
    const r=await createCashTx({branch_id:branch,register_id:register,date,direction:'in',category,source_type:src,amount:amt,notes:(notes||'')+lab,related_table,related_id,group_id:g});
    if(!r.data)return {ids,ok:false};ids.push(r.data.id);
  }
  return {ids,ok:true};
}

/* بيصرف مبلغ من خزنة ويسجّل لو الفلوس مستلفة من حد (مشروع/فرع/شريك/غيره) عشان تفضل فاكرها لحد ما ترجع */
async function projectAvailable(pid){
  const proj=await Q1(sb.from('solar_projects').select('project_name').eq('id',pid).maybeSingle());
  const prof=await Q(sb.from('solar_project_profitability').select('*'));
  const r=(prof.find(x=>x.project_id===pid))||(proj&&prof.find(x=>x.project_name===proj.project_name));
  if(!r)return Infinity;
  return Math.max(0,num(r.total_collected)-num(r.total_material_cost)-num(r.total_other_cost));
}
async function spendFunded({branch,register,date,amount,category,source='capital',notes,related_table,related_id,attachment_url,fund='own',fproj,fbranch,fpartner,fother,item,project_id,availAdj=0,checkProject=false}){
  if(!register){toast('اختر الخزنة','err');return null;}
  const err=validateFund({fund,fproj,fbranch,fpartner,fother});if(err){toast(err,'err');return null;}
  if(fund==='project_advance'){source='capital';}
  else if(fund==='own'&&(source==='profit'||(checkProject&&project_id))){
    const av=(project_id?await projectAvailable(project_id):await profitAvailable(branch))+num(availAdj);
    if(av!==Infinity&&amount>av+0.005){
      const msg=project_id
        ? `المشروع لسه ما جمعش الفلوس دي — المتاح من تحصيله دلوقتي ${fmt(av)} بس، والمبلغ ده ${fmt(amount)}.\n\nلو كمّلت كده هيتسجّل خصم مباشر من رأس مال الفرع (${esc(bname(branch))}) من غير متابعة.\nلو عايز تتابعها وترجعها لما المشروع يحصّل، اضغط إلغاء واختار "سلفة من رأس المال للمشروع نفسه" كمصدر بدل كده.`
        : `المكسب المتاح في خزائن ${esc(bname(branch))} هو ${fmt(av)} بس، والمبلغ ده ${fmt(amount)}.\nيعني الفرق هيتاخد من رأس المال.\n\nتكمّل؟`;
      if(!await ask(msg,{ok:'كمّل من رأس المال'}))return null;
    }
  }
  const base={branch_id:branch,register_id:register,date,direction:'out',category,source_type:source,amount,notes,related_table,related_id,attachment_url,expense_item:item};
  const oblBase={branch_id:branch,amount,reason:notes||null,date:date||todayStr(),related_table:related_table||null,related_id:related_id||null};
  if(project_id)oblBase.project_id=project_id;
  if(fund==='branch'){
    const lreg=(await L.regs(fbranch)).find(r=>r.active!==false);
    if(!lreg){toast('الفرع اللي هيسلّف مالوش خزنة نشطة','err');return null;}

  const r=await createCashTx(base);if(!r.data)return null;
  let ob=null;
  if(fund==='project'){const p=(await allProjects()).find(x=>x.id===fproj);ob=await addObligation({...oblBase,kind:'project',ref_id:fproj,ref_label:p?.project_name||'مشروع',cash_transaction_id:r.data.id});}

  if(fund==='other')ob=await addObligation({...oblBase,kind:'other',ref_label:fother,cash_transaction_id:r.data.id});
  if(fund==='project_advance'&&project_id){const p=(await allProjects()).find(x=>x.id===project_id);ob=await addObligation({...oblBase,kind:'project',ref_id:project_id,ref_label:'رأس مال الفرع لمشروع '+(p?.project_name||''),cash_transaction_id:r.data.id});}
  r.data.obligation_id=ob?.id||null;
  return r.data;
}

function readFundRows(prefix,total){
  const rows=[...document.querySelectorAll(`#${prefix}-frows .lrow`)].map(r=>({kind:r.querySelector('.fr-kind').value,val:(r.querySelector('.fr-val')||{}).value||'',amt:r.querySelector('.fr-amt').value===''?null:num(r.querySelector('.fr-amt').value)}));
  if(!rows.length)return {error:'حدّد الفلوس جت منين'};
  const blanks=rows.filter(r=>r.amt===null);if(blanks.length>1)return {error:'اكتب مبلغ لكل مصدر ما عدا واحد'};
  const given=sum(rows.filter(r=>r.amt!==null),'amt');
  if(blanks.length===1){blanks[0].amt=Math.round((total-given)*100)/100;if(blanks[0].amt<=0)return {error:'مجموع المبالغ أكبر من الإجمالي'};}
  else if(Math.abs(given-total)>0.01)return {error:`مجموع المصادر (${fmt(given)}) لازم يساوي الإجمالي (${fmt(total)})`};
  for(const r of rows)if(['project','partner','branch','other'].includes(r.kind)&&!r.val)return {error:'كمّل بيانات مصدر الفلوس'};
  if(rows.some(r=>r.kind==='project_advance')&&!VF_PID)return {error:'سلفة رأس المال دي محتاجة تكون جوه شاشة مرتبطة بمشروع'};
  return {rows};
}

async function addStock(prod,qty,unitCost,{movType='purchase_in',branch,related_table,related_id,date,notes}={}){
  // يضيف كمية لصنف بمتوسط تكلفة مرجّح، ويسجّل حركة مخزون
  const q0=num(prod.current_quantity),c0=num(prod.current_cost);const nq=q0+qty;
  const nc=prod.costing_method==='fixed_manual'?c0:((q0>0?q0*c0:0)+qty*unitCost)/(nq||1);
  await sb.from('inventory_movements').insert({product_id:prod.id,branch_id:branch||prod.branch_id,type:movType,quantity:qty,unit_cost:unitCost,related_table:related_table||null,related_id:related_id||null,date:date||todayStr(),notes:notes||null});
  await sb.from('products').update({current_quantity:nq,current_cost:nc}).eq('id',prod.id);
  prod.current_quantity=nq;prod.current_cost=nc;return prod;
}
async function takeStock(prod,qty,{movType='sale_out',branch,related_table,related_id,date,notes}={}){
  const nq=num(prod.current_quantity)-qty;
  await sb.from('inventory_movements').insert({product_id:prod.id,branch_id:branch||prod.branch_id,type:movType,quantity:-qty,unit_cost:num(prod.current_cost),related_table:related_table||null,related_id:related_id||null,date:date||todayStr(),notes:notes||null});
  await sb.from('products').update({current_quantity:nq}).eq('id',prod.id);prod.current_quantity=nq;return prod;
}

}

async function fetchActivity(ids,type,limit=200){

  if(!type||type==='cash'){(await Q(inS(sb.from('cash_transactions').select('date,category,amount,direction,is_reversed,is_cancelled,notes,reversal_of,branch_id').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'حركة الخزينة',label:(CATS[r.category]||r.category)+(r.notes?' — '+r.notes:''),amount:r.amount,dir:r.direction,dim:r.is_reversed||r.is_cancelled||!!r.reversal_of,branch:r.branch_id}));}
  if(!type||type==='sales'){(await Q(inS(sb.from('sales_invoices').select('date,total_amount,is_cancelled,branch_id,customers(name)').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'فاتورة بيع',label:'فاتورة لـ '+(r.customers?.name||'بدون عميل'),amount:r.total_amount,dir:'in',dim:r.is_cancelled,branch:r.branch_id}));}
  if(!type||type==='purchases'){(await Q(inS(sb.from('supplier_invoices').select('date,amount,is_cancelled,branch_id,suppliers(name)').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'فاتورة شراء',label:'فاتورة من '+(r.suppliers?.name||'-'),amount:r.amount,dir:'out',dim:r.is_cancelled,branch:r.branch_id}));}
  if(!type||type==='capital'){
    (await Q(inS(sb.from('partner_capital_movements').select('date,amount,type,is_cancelled,branch_id,partners(name)').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'رأس المال',label:(CAP_TYPES[r.type]||r.type)+' — '+(r.partners?.name||'-'),amount:r.amount,dir:r.type==='contribution'?'in':'out',dim:r.is_cancelled,branch:r.branch_id}));
    (await Q(inS(sb.from('partner_advances').select('date,amount,kind,is_cancelled,branch_id').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'رأس المال',label:CAP_TYPES[r.kind]||r.kind,amount:r.amount,dir:r.kind==='advance'?'out':'in',dim:r.is_cancelled,branch:r.branch_id}));
  }
  if(!type||type==='solar'){
    (await Q(inS(sb.from('solar_project_payment_milestones').select('paid_date,paid_amount,is_cancelled,branch_id,solar_projects(project_name)').eq('status','paid').limit(limit)))).forEach(m=>items.push({date:m.paid_date,type:'طاقة شمسية — تحصيل',label:m.solar_projects?.project_name||'-',amount:m.paid_amount,dir:'in',dim:m.is_cancelled,branch:m.branch_id}));
    (await Q(inS(sb.from('solar_project_costs').select('date,amount,is_cancelled,branch_id,solar_projects(project_name)').order('date',{ascending:false}).limit(limit)))).forEach(c=>items.push({date:c.date,type:'طاقة شمسية — تكلفة',label:c.solar_projects?.project_name||'-',amount:c.amount,dir:'out',dim:c.is_cancelled,branch:c.branch_id}));
  }
  if(!type||type==='labor'){(await Q(inS(sb.from('daily_attendance').select('date,day_wage_earned,advance_amount,paid_amount,is_cancelled,branch_id,daily_workers(name)').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'عمالة يومية',label:r.daily_workers?.name||'-',amount:(num(r.advance_amount)+num(r.paid_amount))||r.day_wage_earned,dir:'out',dim:r.is_cancelled,branch:r.branch_id}));}
  if(!type||type==='transfers'){const l=ids.join(',');(await Q(sb.from('inter_branch_transfers').select('date,amount,type,is_cancelled,from_branch_id,to_branch_id').or(`from_branch_id.in.(${l}),to_branch_id.in.(${l})`).order('date',{ascending:false}).limit(limit))).forEach(r=>items.push({date:r.date,type:'تحويل بين فروع',label:bname(r.from_branch_id)+' ← '+bname(r.to_branch_id)+(r.type==='loan'?' (سلفة)':' (رأس مال)'),amount:r.amount,dir:'out',dim:r.is_cancelled,branch:r.from_branch_id}));}
  if(!type||type==='withdrawals'){(await Q(inS(sb.from('profit_withdrawals').select('date,amount,source_table,is_cancelled,branch_id').order('date',{ascending:false}).limit(limit)))).forEach(r=>items.push({date:r.date,type:'سحب مكسب',label:r.source_table==='sales_invoices'?'من فاتورة بيع':'من مشروع شمسي',amount:r.amount,dir:'out',dim:r.is_cancelled,branch:r.branch_id}));}
  return items.filter(i=>i.date).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}

R.dash=async()=>{
  const ids=S.scope==='all'?allIds():[S.scope];const today=todayStr(),m0=monthNow(),months=lastMonths(12),from12=months[0]+'-01';
  const inS=q=>q.in('branch_id',ids);const mk=r=>String(r.month).slice(0,7);
  const [regs,invv,custs,recv,sups,supd,cashm,salesm,solarm,caps,psum,bprofit,obl]=await Promise.all([
    Q(inS(sb.from('v_register_balances').select('*').eq('active',true))),
    Q(inS(sb.from('v_inventory_value').select('*'))),
    Q(inS(sb.from('v_customer_balances').select('customer_id,name,branch_id,remaining'))),
    Q(inS(sb.from('v_receivable_detail').select('customer_id,branch_id,remaining,due_date').gt('remaining',0.01))),
    Q(inS(sb.from('v_supplier_balances').select('supplier_id,name,branch_id'))),
    Q(inS(sb.from('v_supplier_invoice_detail').select('supplier_id,branch_id,remaining,due_date').gt('remaining',0.01))),
    Q(inS(sb.from('v_cash_monthly').select('*').gte('month',from12))),
    Q(inS(sb.from('v_sales_monthly').select('*').gte('month',from12))),
    Q(inS(sb.from('v_solar_monthly').select('*').gte('month',from12))),
    Q(inS(sb.from('v_branch_capital').select('*'))),
    Q(sb.from('v_partner_summary').select('*')),
    Q(inS(sb.from('v_branch_profit').select('*'))),
    Q(inS(sb.from('fund_obligations').select('amount,returned').eq('is_cancelled',false)))
  ]);
  const [mil,visits,acts,losses]=await Promise.all([
    Q(inS(sb.from('solar_project_payment_milestones').select('milestone_name,due_amount,due_date,solar_projects(project_name)').eq('status','pending').eq('is_cancelled',false).lte('due_date',addDays(today,14)).order('due_date'))),
    Q(inS(sb.from('solar_project_maintenance_visits').select('scheduled_date,solar_projects(project_name)').eq('status','scheduled').lte('scheduled_date',addDays(today,14)).order('scheduled_date'))),
    fetchActivity(ids,'',12),
    Q(inS(sb.from('stock_returns').select('loss_amount').gte('date',m0+'-01').eq('is_cancelled',false)))
  ]);
  const cash=sum(regs,'balance'),stock=sum(invv,'value'),owed=sum(recv,'remaining'),payables=sum(supd,'remaining');
  const overRecv=sum(recv.filter(r=>r.due_date&&r.due_date<today),'remaining'),overPay=sum(supd.filter(r=>r.due_date&&r.due_date<today),'remaining');
  const oblOpen=sum(obl,o=>num(o.amount)-num(o.returned)),capCash=sum(regs,'capital_balance'),profCash=sum(regs,'profit_balance');
  const capital=sum(caps,'capital'),profit=sum(bprofit,'profit'),advOpen=sum(psum,r=>num(r.advances)-num(r.advance_repaid));
  const by=(rows,f,cond)=>{const o={};rows.forEach(r=>{if(cond&&!cond(r))return;o[mk(r)]=(o[mk(r)]||0)+num(r[f]);});return o;};
  const salesBy=by(salesm,'total_sales'),solarBy=by(solarm,'collected');
  const inBy=by(cashm,'total',r=>r.source_type==='profit'&&r.direction==='in'),outBy=by(cashm,'total',r=>r.source_type==='profit'&&r.direction==='out');
  const lowStock=sum(invv,'low_stock');
  const custName=Object.fromEntries(custs.map(c=>[c.customer_id,c.name])),supName=Object.fromEntries(sups.map(s=>[s.supplier_id,s.name]));
  const lateC={};recv.filter(r=>r.due_date&&r.due_date<today).forEach(r=>lateC[r.customer_id]=(lateC[r.customer_id]||0)+num(r.remaining));
  const lateP={};supd.filter(r=>r.due_date&&r.due_date<today).forEach(r=>lateP[r.supplier_id]=(lateP[r.supplier_id]||0)+num(r.remaining));
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const scopeChips=chips([['all','كل الفروع'],...S.branches.map(b=>[b.id,esc(b.name)])],S.scope,'setScope');
  const net=cash+stock+owed-payables;
  const branchRows=S.scope==='all'&&S.branches.length>1?S.branches.map(b=>{
    const c=sum(regs.filter(r=>r.branch_id===b.id),'balance'),s=sum(invv.filter(r=>r.branch_id===b.id),'value'),o=sum(recv.filter(r=>r.branch_id===b.id),'remaining'),p=sum(supd.filter(r=>r.branch_id===b.id),'remaining');
    const sm=sum(salesm.filter(r=>r.branch_id===b.id&&mk(r)===m0),'total_sales'),so=sum(solarm.filter(r=>r.branch_id===b.id&&mk(r)===m0),'collected');
    return TR([`<b>${esc(b.name)}</b>`,`<span class="n">${fmt(c)}</span>`,`<span class="n">${fmt(s)}</span>`,`<span class="n">${fmt(o)}</span>`,`<span class="n">${fmt(p)}</span>`,`<span class="n">${fmt(c+s+o-p)}</span>`,`<span class="n">${fmt(sm)}</span>`,`<span class="n">${fmt(so)}</span>`,`<span class="n">${fmt(sum(bprofit.filter(r=>r.branch_id===b.id),'profit'))}</span>`]);

    <div class="bx"><div class="kl">علينا للموردين</div><div class="kv">${fmt(payables)}</div></div><div class="op">=</div>

async function submitInvoice(){return once('inv',async()=>{
  if(!S.branch)return toast('اختر فرعًا أولًا','err');
  const h=gf('f-inv');if(!h)return;
  const lines=[...document.querySelectorAll('#inv-lines .lrow')].map(r=>{const name=r.querySelector('.l-prod').value.trim();return {name,p:prodByName(V.prods,name),qty:num(r.querySelector('.l-qty').value),price:num(r.querySelector('.l-price').value)};}).filter(l=>l.name||l.qty||l.price);
  if(!lines.length)return toast('أضف صنفًا واحدًا على الأقل','err');
  const bad=lines.find(l=>!l.p||l.qty<=0||l.price<0);
  if(bad)return toast(bad.p?'راجع الكمية والسعر في كل الأصناف':`الصنف "${bad.name}" مش موجود في المخزون`,'err');
  const total=sum(lines,l=>l.qty*l.price);
  let paid=h.status==='full'?total:h.status==='credit'?0:num(h.paid);
  if(h.status!=='full'&&!h.customer)return toast('البيع الآجل أو الجزئي لازم يتحدد له عميل','err');
  if(h.status==='partial'&&(paid<=0||paid>=total))return toast('المدفوع في البيع الجزئي لازم يكون أكبر من صفر وأقل من الإجمالي','err');
  if(paid>0&&!h.register)return toast('اختر الخزنة اللي هتستلم المدفوع','err');
  const short=lines.filter(l=>num(l.p.current_quantity)<l.qty);
  if(short.length&&!await ask(`الكمية المطلوبة أكبر من المتاح في:\n${short.map(l=>`• ${l.name} (المتاح ${l.p.current_quantity})`).join('\n')}\n\nتكمّل والمخزون يبقى بالسالب؟`,{ok:'كمّل'}))return;
  if(h.customer&&paid<total){
    const cust=await Q1(sb.from('v_customer_balances').select('name,credit_limit,remaining').eq('customer_id',h.customer).maybeSingle());
    if(cust&&cust.credit_limit&&num(cust.remaining)+(total-paid)>num(cust.credit_limit)&&!await ask(`العميل "${esc(cust.name)}" هيتخطى حد الآجل (${fmt(cust.credit_limit)}).\nدينه الحالي ${fmt(cust.remaining)} + الفاتورة دي ${fmt(total-paid)} = ${fmt(num(cust.remaining)+total-paid)}\n\nتكمّل؟`,{ok:'كمّل'}))return;
  }
  const status=paid>=total-0.005?'full':paid>0?'partial':'credit';
  const inv=await M(sb.from('sales_invoices').insert({branch_id:S.branch,customer_id:h.customer||null,date:h.date,total_amount:total,paid_amount:paid,payment_status:status}).select().single());
  if(!inv)return;
  for(const l of lines){
    await sb.from('sales_invoice_items').insert({invoice_id:inv.id,product_id:l.p.id,quantity:l.qty,unit_price:l.price,unit_cost:num(l.p.current_cost)});
    await takeStock(l.p,l.qty,{movType:'sale_out',branch:S.branch,related_table:'sales_invoices',related_id:inv.id,date:h.date});
  }
  const ratio=total>0?sum(lines,l=>l.qty*num(l.p.current_cost))/total:0;
  if(paid>0)await saleCashIn({branch:S.branch,register:h.register,date:h.date,amount:paid,ratio,notes:'فاتورة بيع',related_table:'sales_invoices',related_id:inv.id});
  if(total-paid>0.005&&h.customer)await sb.from('receivables').insert({customer_id:h.customer,branch_id:S.branch,invoice_id:inv.id,amount:total-paid,original_amount:total-paid,cost_ratio:ratio,due_date:h.due||addDays(h.date,30),debt_date:h.date,status:paid>0?'partially_collected':'open'});
  await logAudit('sales_invoices','insert',inv.id,inv);
  toast('تم حفظ الفاتورة','ok');refresh();
  if(await ask('تطبع الفاتورة؟',{ok:'طباعة'}))printInvoice(inv.id);
});}

async function cancelSalesInvoice(id){
  const inv=await Q1(sb.from('sales_invoices').select('*').eq('id',id).single());if(!inv||inv.is_cancelled)return;
  const recvs=await Q(sb.from('receivables').select('id').eq('invoice_id',id));

  if(!await ask('هيتم إلغاء الفاتورة وعكس أثرها بالكامل:\n• رجوع الأصناف للمخزون\n• عكس المبلغ المدفوع في الخزنة\n• إلغاء الآجل المرتبط بها\n\nمتأكد؟',{danger:true,ok:'إلغاء الفاتورة'}))return;
  const items=await Q(sb.from('sales_invoice_items').select('*').eq('invoice_id',id));
  for(const it of items){
    const p=await Q1(sb.from('products').select('id,current_quantity').eq('id',it.product_id).maybeSingle());if(!p)continue;
    await sb.from('inventory_movements').insert({product_id:it.product_id,branch_id:inv.branch_id,type:'customer_return',quantity:num(it.quantity),unit_cost:num(it.unit_cost),related_table:'sales_invoices',related_id:id,notes:'إلغاء فاتورة بيع'});

  }
  const txs=await Q(sb.from('cash_transactions').select('id,is_reversed,reversal_of').eq('related_table','sales_invoices').eq('related_id',id));
  for(const t of txs)if(!t.is_reversed&&!t.reversal_of)await reverseCashTx(t.id);

async function saveDebt(){return once('debt',async()=>{
  const h=readForm('dbt',FORMS.dbt);if(!h)return;
  let customer_id=h.cust,branch=V.debt.branch;
  if(!customer_id&&!h.name)return toast('اختر عميلًا أو اكتب اسم عميل جديد','err');
  const lines=[...document.querySelectorAll('#dbt-lines .lrow')].map(r=>{const name=r.querySelector('.l-prod').value.trim();return {name,p:prodByName(V.debt.prods,name),qty:num(r.querySelector('.l-qty').value),price:num(r.querySelector('.l-price').value)};}).filter(l=>l.name&&l.qty>0);
  const total=num(h.amount);if(total<=0)return toast('اكتب إجمالي الدين أو أضف أصناف بأسعارها','err');
  const paid=num(h.paid);if(paid<0||paid>total)return toast('المدفوع لازم يكون بين صفر وإجمالي الدين','err');
  if(!customer_id){
    const c=await M(sb.from('customers').insert({branch_id:branch,name:h.name,phone:h.phone||null,credit_limit:h.limit}).select().single());if(!c)return;customer_id=c.id;
  }
  const rem=total-paid;
  const costRatio=h.capital!=null&&total>0?Math.min(1,Math.max(0,num(h.capital)/total)):(total>0?Math.min(1,sum(lines,l=>l.p?l.qty*num(l.p.current_cost):0)/total):0);
  const r=await M(sb.from('receivables').insert({customer_id,branch_id:branch,amount:rem,original_amount:total,cost_ratio:costRatio,due_date:h.due||null,debt_date:h.date,notes:h.notes||null,status:rem<=0.005?'collected':paid>0?'partially_collected':'open'}).select().single());
  if(!r)return;
  if(lines.length)await sb.from('receivable_items').insert(lines.map(l=>({receivable_id:r.id,product_id:l.p?.id||null,item_name:l.name,quantity:l.qty,unit_price:l.price})));
  if($('dbt-deduct').checked){for(const l of lines)if(l.p)await takeStock(l.p,l.qty,{movType:'sale_out',branch,related_table:'receivables',related_id:r.id,date:h.date,notes:'بيع آجل'});}
  if(paid>0){
    let txId=null;
    if(h.payreg){const x=await saleCashIn({branch,register:h.payreg,date:h.date,amount:paid,ratio:costRatio,category:'collection_receivable',notes:'دفعة على دين عميل',related_table:'receivables',related_id:r.id});txId=x.ids[0]||null;}
    await sb.from('receivable_collections').insert({receivable_id:r.id,amount:paid,cash_transaction_id:txId,date:h.date});
  }
  await logAudit('receivables','insert',r.id,r);closeModal(true);toast('تم تسجيل الدين','ok');refresh();
});}

async function syncInvoicePaid(invoiceId,delta){

}
async function collectDialog(customerId,receivableId,reopen){
  const cust=await Q1(sb.from('v_customer_balances').select('*').eq('customer_id',customerId).single());if(!cust)return;
  let debts=await Q(sb.from('v_receivable_detail').select('*').eq('customer_id',customerId).gt('remaining',0.01).order('debt_date'));
  if(receivableId)debts=debts.filter(d=>d.receivable_id===receivableId);
  if(!debts.length){toast('مفيش مديونية مفتوحة على العميل ده','err');return;}
  const total=sum(debts,'remaining'),regs=await L.regs(cust.branch_id),sups=await L.suppliers(cust.branch_id);
  const v=await askForm('تحصيل من '+esc(cust.name),[
    {k:'amount',l:'المبلغ المحصَّل',t:'number',v:total,req:1,hint:`المتبقي ${fmt(total)} — بيتوزّع على الأقدم فالأحدث`},
    {k:'date',l:'التاريخ',t:'date',v:todayStr(),req:1},
    {k:'reg',l:'دخل على خزنة',t:'select',opts:regOpts(regs,{none:'— بدون تحريك خزنة —'}),v:regs.find(r=>r.active!==false)?.id||''},
    {k:'cls',l:'الفلوس دي إيه؟',t:'select',opts:[['auto','حسب نسبة رأس المال في الدين (تلقائي)'],['capital','كلها رأس مال'],['profit','كلها مكسب'],['manual','أحدد كام منها رأس مال']],w:'w2',hint:'رأس المال بيرجع لرأس المال في الخزنة، والمكسب بيتحسب مكسب'},
    {k:'capamt',l:'كام منها رأس مال (لو حددت يدوي)',t:'number'},
    {k:'supplier',l:'ادفع منها لمورد دلوقتي (اختياري)',t:'select',opts:[['','— لا —'],...sups.filter(x=>x.active!==false).map(x=>[x.id,x.name])],w:'w2',hint:'بتدخل الخزنة وتخرج منها للمورد، وتتخصم من مستحقه'},
    {k:'supamt',l:'المبلغ اللي هيتدفع للمورد',t:'number'},
    {k:'notes',l:'ملاحظات',w:'wide'}
  ],{ok:'تسجيل التحصيل',check:v=>v.amount<=0?'اكتب مبلغًا صحيحًا':v.amount>total+0.01?`المبلغ أكبر من المتبقي (${fmt(total)})`:(v.cls==='manual'&&(v.capamt==null||v.capamt<0||v.capamt>v.amount+0.01))?'رأس المال لازم يكون بين صفر والمبلغ المحصَّل':(v.supplier&&!(v.supamt>0))?'اكتب المبلغ اللي هيتدفع للمورد':(v.supplier&&v.supamt>v.amount+0.01)?'المبلغ للمورد أكبر من المحصَّل':(v.supplier&&!v.reg)?'الدفع للمورد محتاج خزنة':null});
  if(!v){if(reopen)showCustomerStatement(customerId);return;}
  await once('collect',async()=>{
    const alloc=[];let left=v.amount;
    for(const d of debts){if(left<=0.004)break;const pay=Math.min(left,num(d.remaining));alloc.push({d,pay});left-=pay;}
    const capPart=sum(alloc,x=>x.pay*num(x.d.cost_ratio));
    let ratio=v.amount>0?capPart/v.amount:0;if(v.cls==='capital')ratio=1;else if(v.cls==='profit')ratio=0;else if(v.cls==='manual')ratio=num(v.capamt)/v.amount;
    let txId=null;
    if(v.reg){const r=await saleCashIn({branch:cust.branch_id,register:v.reg,date:v.date,amount:v.amount,ratio,category:'collection_receivable',notes:'تحصيل من '+cust.name+(v.notes?' — '+v.notes:''),related_table:'receivables',related_id:receivableId||null});if(!r.ok)return;txId=r.ids[0]||null;}
    for(const {d,pay} of alloc){
      const nr=num(d.remaining)-pay;
      await sb.from('receivable_collections').insert({receivable_id:d.receivable_id,amount:pay,cash_transaction_id:txId,date:v.date});
      await sb.from('receivables').update({amount:Math.max(0,nr),status:nr<=0.005?'collected':'partially_collected'}).eq('id',d.receivable_id);
      await syncInvoicePaid(d.invoice_id,pay);
    }
    if(v.supplier&&num(v.supamt)>0){
      const sup=sups.find(x=>x.id===v.supplier),capCol=ratio*v.amount,fromCap=Math.min(num(v.supamt),capCol),fromProf=num(v.supamt)-fromCap,g=newGroup(),ids=[];
      for(const [src,amt] of [['capital',fromCap],['profit',fromProf]]){if(amt<=0.004)continue;const r=await createCashTx({branch_id:cust.branch_id,register_id:v.reg,date:v.date,direction:'out',category:'supplier_payment',source_type:src,amount:amt,notes:`دفعة للمورد ${sup?.name||''} من تحصيل ${cust.name}`,related_table:'supplier_invoices',group_id:g});if(r.data)ids.push(r.data.id);}
      const ok=await allocSupplierPayment(v.supplier,num(v.supamt),v.date,ids[0]||null);
      if(!ok)toast('المورد ده مالوش فواتير مفتوحة — الفلوس اتسجّلت خروج من الخزنة بس','err');
    }
    await logAudit('receivables','collect',receivableId||customerId,{amount:v.amount,customer:cust.name});
    toast('تم تسجيل التحصيل','ok');
  });
  if(reopen)showCustomerStatement(customerId);else refresh();
}
async function undoCollection(collId,customerId){
  const c=await Q1(sb.from('receivable_collections').select('*').eq('id',collId).single());if(!c)return;
  if(!await ask('هيتم التراجع عن التحصيل ده: المبلغ يرجع على العميل'+(c.cash_transaction_id?' وتتعكس حركة الخزنة':'')+'. متأكد؟',{danger:true,ok:'تراجع عن التحصيل'}))return showCustomerStatement(customerId);
  const r=await Q1(sb.from('receivables').select('*').eq('id',c.receivable_id).single());if(!r)return;
  const nr=num(r.amount)+num(c.amount),orig=num(r.original_amount)||nr;
  if(c.cash_transaction_id){const others=await Q(sb.from('receivable_collections').select('id').eq('cash_transaction_id',c.cash_transaction_id));
    if(others.length<=1)await reverseCashTx(c.cash_transaction_id);else toast('حركة الخزنة دي مشتركة مع تحصيلات تانية — اعكسها يدويًا من الحركة اليومية لو لزم','err');}

  await syncInvoicePaid(r.invoice_id,-num(c.amount));

    ids.length?Q(sb.from('receivable_collections').select('*').in('receivable_id',ids)):[],

    invIds.length?Q(sb.from('sales_invoices').select('id,total_amount').in('id',invIds)):[],
    invIds.length?Q(sb.from('sales_invoice_items').select('invoice_id,quantity,unit_price,products(name)').in('invoice_id',invIds)):[]

/* --- حذف نهائي للدين / العميل (لتصحيح بيانات اتسجّلت غلط) --- */
async function purgeReceivable(rid,reverseCash){
  const cols=await Q(sb.from('receivable_collections').select('*').eq('receivable_id',rid));
  if(reverseCash){const seen=new Set();for(const c of cols){if(!c.cash_transaction_id||seen.has(c.cash_transaction_id))continue;seen.add(c.cash_transaction_id);const t=await Q1(sb.from('cash_transactions').select('is_reversed,reversal_of').eq('id',c.cash_transaction_id).maybeSingle());if(t&&!t.is_reversed&&!t.reversal_of)await reverseCashTx(c.cash_transaction_id);}}
  const old=await Q1(sb.from('receivables').select('*').eq('id',rid).maybeSingle());
  await sb.from('receivable_items').delete().eq('receivable_id',rid);
  await sb.from('receivable_collections').delete().eq('receivable_id',rid);
  const {data,error}=await sb.from('receivables').delete().eq('id',rid).select();
  if(error){toast('تعذّر حذف الدين: '+error.message,'err');return false;}
  if(!data||!data.length){toast('لم يُحذف الدين — صلاحيات الحذف (RLS) في Supabase مش سامحة على جدول receivables','err');return false;}
  await logAudit('receivables','delete',rid,old);return true;
}
async function deleteDebt(rid,customerId){
  const cols=await Q(sb.from('receivable_collections').select('id,cash_transaction_id').eq('receivable_id',rid));const withCash=cols.filter(c=>c.cash_transaction_id).length;
  const r=await Q1(sb.from('receivables').select('invoice_id').eq('id',rid).maybeSingle());
  const v=await askForm('حذف نهائي للدين',withCash?[{k:'rev',l:`اعكس حركات الخزنة للدفعات (${withCash})`,t:'check',v:true,w:'wide'}]:[],{ok:'احذف الدين نهائيًا',note:`هيتمسح الدين ودفعاته (${cols.length}) وأصنافه. لا يمكن التراجع.${r?.invoice_id?'<br><b>الدين ده مرتبط بفاتورة بيع — الأفضل تلغي الفاتورة نفسها من "سجل الفواتير".</b>':''}`});
  if(!v)return showCustomerStatement(customerId);
  if(await purgeReceivable(rid,v.rev!==false))toast('تم حذف الدين','ok');
  showCustomerStatement(customerId);
}
async function deleteCustomer(id){
  const c=await Q1(sb.from('customers').select('*').eq('id',id).maybeSingle());if(!c)return;
  const [debts,inv,proj,eo]=await Promise.all([Q(sb.from('receivables').select('id').eq('customer_id',id)),Q(sb.from('sales_invoices').select('id').eq('customer_id',id).limit(50)),Q(sb.from('solar_projects').select('id').eq('customer_id',id).limit(50)),Q(sb.from('external_orders').select('id').eq('customer_id',id).limit(50))]);
  const blockers=[inv.length?`${inv.length} فاتورة بيع`:'',proj.length?`${proj.length} مشروع`:'',eo.length?`${eo.length} طلبية من برا`:''].filter(Boolean);
  if(blockers.length){await ask(`مش هينفع تحذف "${esc(c.name)}" لأن عليه ${blockers.join(' و')}.\nاحذف أو ألغِ دول الأول، أو اضغط "تعديل" وعطّل العميل عشان يختفي من القوايم.`,{ok:'تمام'});return;}
  const cols=debts.length?await inChunks(x=>sb.from('receivable_collections').select('id,cash_transaction_id').in('receivable_id',x),debts.map(d=>d.id)):[];const withCash=cols.filter(x=>x.cash_transaction_id).length;
  const v=await askForm('حذف نهائي للعميل: '+esc(c.name),withCash?[{k:'rev',l:`اعكس حركات الخزنة للدفعات (${withCash})`,t:'check',v:true,w:'wide'}]:[],{ok:'احذف العميل وكل ديونه',note:`هيتمسح العميل و${debts.length} دين و${cols.length} دفعة وأصنافها. لا يمكن التراجع.`});
  if(!v)return;
  await once('delcust',async()=>{
    for(const d of debts)if(!await purgeReceivable(d.id,v.rev!==false))return;
    const {data,error}=await sb.from('customers').delete().eq('id',id).select();
    if(error||!data?.length)return toast(error?('تعذّر حذف العميل: '+error.message):'لم يُحذف العميل — صلاحيات الحذف (RLS) في Supabase على جدول customers','err');
    await logAudit('customers','delete',id,c);toast('تم حذف العميل وكل ديونه','ok');refresh();
  });
}

async function editDebtCapital(rid,customerId){

    {ok:'حفظ',note:'الباقي بيتحسب مكسب. بعد الحفظ، أي تحصيل جاي على الدين ده بيتقسم بالنسبة دي (رأس مال / مكسب). اللي اتحصّل قبل كده مش بيتغيّر.',check:v=>v.cap>orig+0.01?'رأس المال أكبر من الدين':null});

async function submitPurchaseInvoice(){return once('pinv',async()=>{
  const h=gf('f-pinv');if(!h)return;
  const lines=[...document.querySelectorAll('#pinv-lines .lrow')].map(r=>({name:r.querySelector('.l-prod').value.trim(),qty:num(r.querySelector('.l-qty').value),cost:num(r.querySelector('.l-cost').value),dest:r.querySelector('.l-dest').value})).filter(l=>l.name||l.qty);
  if(!lines.length)return toast('أضف صنفًا واحدًا على الأقل','err');
  if(lines.some(l=>!l.name||l.qty<=0||l.cost<0))return toast('راجع اسم الصنف والكمية والتكلفة في كل سطر','err');
  if(h.type==='cash'){if(!h.register)return toast('اختر الخزنة اللي هتدفع منها','err');const fe=validateFund(h);if(fe)return toast(fe,'err');}
  const total=sum(lines,l=>l.qty*l.cost);
  // المورد: لو مش مسجّل في الفرع بيتضاف
  let sup=V.sups.find(x=>norm(x.name)===norm(h.supplier));
  if(!sup){
    const other=V.allSups.find(x=>norm(x.name)===norm(h.supplier));
    sup=await M(sb.from('suppliers').insert({branch_id:S.branch,name:h.supplier.trim(),phone:other?.phone||null}).select().single());if(!sup)return;toast(`تمت إضافة المورد "${h.supplier}" لفرع ${bname(S.branch)}`,'ok');
  }
  const cache={},pm={};
  for(const l of lines){l.key=l.dest+'|'+norm(l.name);if(!(l.key in pm)){cache[l.dest]??=await L.products(l.dest);pm[l.key]=prodByName(cache[l.dest],l.name)||null;}}
  const miss=lines.filter((l,i)=>!pm[l.key]&&lines.findIndex(x=>x.key===l.key)===i);
  if(miss.length&&!await ask(`الأصناف دي مش موجودة وهتتضاف للمخزون:\n${miss.map(m=>`• ${m.name} (${bname(m.dest)})`).join('\n')}`,{ok:'أضفها وكمّل'}))return;
  for(const m of miss){pm[m.key]=await ensureProduct(m.name,m.dest,{cost:m.cost,source:'شراء من مورد'});if(!pm[m.key])return;}
  const url=await uploadedUrl(h.file);const invId=newGroup();let payTx=null;
  if(h.type==='cash'){
    payTx=await spendFunded({branch:S.branch,register:h.register,date:h.date,amount:total,category:'supplier_payment',source:h.source,notes:'فاتورة شراء من '+sup.name,related_table:'supplier_invoices',related_id:invId,attachment_url:url,fund:h.fund,fproj:h.fproj,fbranch:h.fbranch,fpartner:h.fpartner,fother:h.fother});
    if(!payTx)return;
  }
  const inv=await M(sb.from('supplier_invoices').insert({id:invId,supplier_id:sup.id,branch_id:S.branch,amount:total,date:h.date,due_date:h.type==='credit'?(h.due||null):null,payment_type:h.type,status:h.type==='cash'?'paid':'open',source_kind:h.pkind||'supplier',notes:url?'مرفق: '+url:null}).select().single());
  if(!inv){if(payTx)await reverseCashTx(payTx.id);return;}
  for(const l of lines){
    const p=pm[l.key];
    await sb.from('supplier_invoice_items').insert({invoice_id:inv.id,product_id:p.id,quantity:l.qty,unit_cost:l.cost,dest_branch_id:l.dest});
    await addStock(p,l.qty,l.cost,{movType:'purchase_in',branch:l.dest,related_table:'supplier_invoices',related_id:inv.id,date:h.date});
  }
  if(payTx)await sb.from('supplier_payments').insert({supplier_id:sup.id,invoice_id:inv.id,amount:total,date:h.date,cash_transaction_id:payTx.id});
  if(h.debt){const per={};lines.filter(l=>l.dest!==S.branch).forEach(l=>per[l.dest]=(per[l.dest]||0)+l.qty*l.cost);
    for(const [to,amt] of Object.entries(per))await sb.from('inter_branch_transfers').insert({from_branch_id:S.branch,to_branch_id:to,amount:amt,date:h.date,type:'loan',status:'open'});}
  await logAudit('supplier_invoices','insert',inv.id,inv);toast('تم حفظ فاتورة الشراء','ok');refresh();
});}

async function saveSupplierPayment(supplierId,invoiceId){return once('paysup',async()=>{
  const s=await Q1(sb.from('suppliers').select('*').eq('id',supplierId).single());if(!s)return;
  let inv=await Q(sb.from('v_supplier_invoice_detail').select('*').eq('supplier_id',supplierId).gt('remaining',0.01).order('date'));
  if(invoiceId)inv=inv.filter(i=>i.invoice_id===invoiceId);
  const total=sum(inv,'remaining');
  const amount=num($('f-sp-amount').value),date=$('f-sp-date').value||todayStr(),reg=$('f-sp-reg').value,notes=$('f-sp-notes').value||'';
  if(amount<=0)return toast('اكتب مبلغًا صحيحًا','err');
  if(amount>total+0.01)return toast(`المبلغ أكبر من المتبقي (${fmt(total)})`,'err');
  if(!reg)return toast('اختر الخزنة','err');
  const fr=readFundRowsFor('f-sp',amount,null);if(fr.error)return toast(fr.error,'err');
  const done=await spendSplit({branch:s.branch_id,register:reg,date,rows:fr.rows,category:'supplier_payment',source:'profit',notes:'دفعة للمورد '+s.name+(notes?' — '+notes:''),related_table:'supplier_invoices',related_id:invoiceId||null});
  if(!done)return;
  const remLeft=inv.map(i=>num(i.remaining));
  for(const d of done){
    let amt=d.row.amt,idx=0;
    while(amt>0.004&&idx<inv.length){
      if(remLeft[idx]<=0.004){idx++;continue;}
      const pay=Math.min(amt,remLeft[idx]);
      await sb.from('supplier_payments').insert({supplier_id:supplierId,invoice_id:inv[idx].invoice_id,amount:pay,date,cash_transaction_id:d.tx.id,notes});
      remLeft[idx]-=pay;amt-=pay;idx++;
    }
  }
  for(let i=0;i<inv.length;i++){
    if(remLeft[i]<=0.004)await sb.from('supplier_invoices').update({status:'paid'}).eq('id',inv[i].invoice_id);
    else if(remLeft[i]<num(inv[i].remaining)-0.004)await sb.from('supplier_invoices').update({status:'partial'}).eq('id',inv[i].invoice_id);
  }
  await logAudit('supplier_payments','insert',supplierId,{amount});
  closeModal(true);toast('تم تسجيل الدفع','ok');refresh();
});}

async function reverseSupplierPayment(paymentId,supplierId){
  const p=await Q1(sb.from('supplier_payments').select('*').eq('id',paymentId).single());if(!p)return;
  if(!await ask('استرجاع الدفعة دي هيعكس حركة الخزنة المرتبطة بيها (لو الفلوس خرجت فعليًا من خزنة) ويرجّع المبلغ للمتبقي على المورد. متأكد؟',{danger:true,ok:'استرجاع الدفعة'})){showSupplierStatement(supplierId);return;}
  if(p.cash_transaction_id){const c=await Q1(sb.from('cash_transactions').select('is_reversed,reversal_of').eq('id',p.cash_transaction_id).maybeSingle());if(c&&!c.is_reversed&&!c.reversal_of)await reverseCashTx(p.cash_transaction_id);}
  await sb.from('supplier_payments').update({is_cancelled:true}).eq('id',paymentId);
  if(p.invoice_id){
    const paidNow=sum(await Q(sb.from('supplier_payments').select('amount').eq('invoice_id',p.invoice_id).eq('is_cancelled',false)),'amount');
    const inv=await Q1(sb.from('supplier_invoices').select('amount').eq('id',p.invoice_id).maybeSingle());
    await sb.from('supplier_invoices').update({status:paidNow<=0.01?'open':(paidNow>=num(inv?.amount)-0.01?'paid':'partial')}).eq('id',p.invoice_id);
  }
  await logAudit('supplier_payments','cancel',paymentId,p);toast('تم استرجاع الدفعة','ok');
  showSupplierStatement(supplierId);
}

async function receiveGoods(poId){
  if(!await ask('تم استلام كل الكميات في أمر الشراء ده بالكامل؟\nهيتضاف المخزون.',{ok:'تسجيل الاستلام'}))return;
  const [po,regs]=await Promise.all([Q1(sb.from('purchase_orders').select('*, purchase_order_items(*)').eq('id',poId).single()),L.regs()]);if(!po)return;
  const v=await askForm('فاتورة المورد',[{k:'inv',l:'فاتورة المورد',t:'select',opts:[['yes','أنشئ الفاتورة دلوقتي'],['no','بعدين']]},{k:'type',l:'نوع الدفع',t:'select',opts:[['credit','آجل'],['cash','كاش']]},{k:'reg',l:'الدفع من خزنة (للكاش)',t:'select',opts:regOpts(regs)},{k:'due',l:'ميعاد السداد (للآجل)',t:'date'}],{ok:'كمّل'});if(!v)return;
  if(v.inv==='yes'&&v.type==='cash'&&!v.reg)return toast('اختر خزنة للدفع الكاش','err');
  await once('recv',async()=>{
    const rc=await M(sb.from('goods_receipts').insert({po_id:poId,branch_id:S.branch}).select().single());if(!rc)return;
    for(const it of po.purchase_order_items||[]){
      await sb.from('goods_receipt_items').insert({receipt_id:rc.id,product_id:it.product_id,quantity:it.quantity,unit_cost:it.unit_cost});
      const p=await Q1(sb.from('products').select('*').eq('id',it.product_id).single());if(p)await addStock(p,num(it.quantity),num(it.unit_cost),{movType:'purchase_in',branch:S.branch,related_table:'goods_receipts',related_id:rc.id});
    }
    await sb.from('purchase_orders').update({status:'received'}).eq('id',poId);
    if(v.inv==='yes'){
      const amount=sum(po.purchase_order_items||[],i=>num(i.quantity)*num(i.unit_cost));
      const inv=await M(sb.from('supplier_invoices').insert({supplier_id:po.supplier_id,branch_id:S.branch,amount,date:todayStr(),due_date:v.type==='credit'?(v.due||null):null,receipt_id:rc.id,payment_type:v.type,status:v.type==='cash'?'paid':'open'}).select().single());
      if(inv&&v.type==='cash'){const {data:tx}=await createCashTx({branch_id:S.branch,register_id:v.reg,direction:'out',category:'supplier_payment',source_type:'profit',amount,notes:'فاتورة من استلام بضاعة',related_table:'supplier_invoices',related_id:inv.id});await sb.from('supplier_payments').insert({supplier_id:po.supplier_id,invoice_id:inv.id,amount,cash_transaction_id:tx?.id||null});}
      await sb.from('purchase_orders').update({status:'invoiced'}).eq('id',poId);
    }
    toast('تم الاستلام وتحديث المخزون','ok');refresh();
  });
}

const PROD_REFS=[['inventory_movements','حركة مخزون',1],['stock_count_items','بند جرد',1],['sales_invoice_items','بند في فاتورة بيع'],['supplier_invoice_items','بند في فاتورة شراء'],['purchase_request_items','بند في طلب شراء'],['purchase_order_items','بند في أمر شراء'],['goods_receipt_items','بند في استلام بضاعة'],['solar_project_material_usage','صرف لمشروع'],['solar_project_equipment','معدات مشروع طاقة شمسية'],['well_job_material_usage','صرف لبئر'],['trading_partner_movements','حركة طرف متبادل']];
const SOFT_REFS=['receivable_items','solar_well_items'];
async function countRef(t,pid){const r=await sb.from(t).select('*',{count:'exact',head:true}).eq('product_id',pid);return r.error?0:(r.count||0);}
async function deleteProduct(pid){
  const p=await Q1(sb.from('products').select('*').eq('id',pid).maybeSingle());if(!p)return;
  const counts=await Promise.all(PROD_REFS.map(async([t,l,clean])=>({t,l,clean,n:await countRef(t,pid)})));
  const soft=await Promise.all(SOFT_REFS.map(async t=>({t,n:await countRef(t,pid)})));
  const used=counts.filter(c=>c.n>0),docs=used.filter(c=>!c.clean);
  const lines=used.map(c=>`• ${c.n} ${c.l}`).join('<br>');
  const fields=docs.length?[{k:'force',l:'احذف الصنف مع البنود المرتبطة بيه دي (نهائي)',t:'check',w:'wide'}]:[];
  const note=(lines?`الصنف "${esc(p.name)}" مرتبط بـ:<br>${lines}<br><br>`:'')+(docs.length?'<b>فيه فواتير وحركات حقيقية عليه.</b> لو الصنف اتسجّل بالغلط ممكن تحذفه مع بنوده (إجمالي الفواتير مش هيتغيّر والكميات مش هترجع لأي مكان). لو الصنف سليم وعايز تخفيه بس، عطّله بدل الحذف.':'الحذف نهائي ولا يمكن التراجع.');
  const v=await askForm('حذف الصنف: '+esc(p.name),fields,{ok:'احذف الصنف',note});
  if(!v)return;if(docs.length&&!v.force)return toast('ماتحذفش — لو عايز تخفي الصنف اضغط "تعطيل"','err');
  await once('delprod',async()=>{
    for(const c of used){
      const r=await sb.from(c.t).delete().eq('product_id',pid).select();
      if(r.error)return toast(`تعذّر حذف (${c.l}): ${r.error.message}`,'err');
      if(!(r.data&&r.data.length))return toast(`لم تُحذف (${c.l}) — صلاحيات الحذف (RLS) على جدول ${c.t}`,'err');
    }
    for(const s of soft)if(s.n)await sb.from(s.t).update({product_id:null}).eq('product_id',pid);
    // بنحاول نحذف الصنف؛ لو فيه جدول تاني مرتبط بيه (مش في القايمة) بنعرفه من رسالة الخطأ ونسألك
    for(let guard=0;guard<10;guard++){
      const {data,error}=await sb.from('products').delete().eq('id',pid).select();
      if(!error&&data?.length){await logAudit('products','delete',pid,p);toast('تم حذف الصنف','ok');refresh();return;}
      const m=error&&String(error.message).match(/constraint "([^"]+)" on table "(\w+)"/);
      if(!m)return toast(error?('تعذّر حذف الصنف: '+error.message):'لم يُحذف الصنف — صلاحيات الحذف (RLS) على جدول products. شغّل ملف alahd-delete-permissions.sql','err');
      const tbl=m[2],col=m[1].replace(new RegExp('^'+tbl+'_'),'').replace(/_fkey$/,'');
      const cnt=await sb.from(tbl).select('*',{count:'exact',head:true}).eq(col,pid);
      if(!await ask(`الصنف مرتبط كمان بجدول "${tbl}" (${cnt.count||'؟'} سجل).\nأحذف السجلات دي كمان وأكمّل؟`,{danger:true,ok:'احذفها وكمّل'}))return;
      const r=await sb.from(tbl).delete().eq(col,pid).select();
      if(r.error)return toast(`تعذّر حذف السجلات من ${tbl}: ${r.error.message}`,'err');
      if(!r.data?.length)return toast(`لم تُحذف سجلات ${tbl} — صلاحيات الحذف (RLS). شغّل ملف alahd-delete-permissions.sql`,'err');
    }
    toast('الصنف مرتبط بجداول كتير، ماقدرتش أكمّل','err');
  });
}
async function reverseSupplierInvoiceEffects(inv){
  const [items,pays]=await Promise.all([Q(sb.from('supplier_invoice_items').select('*').eq('invoice_id',inv.id)),Q(sb.from('supplier_payments').select('*').eq('invoice_id',inv.id).eq('is_cancelled',false))]);
  for(const it of items){const p=await Q1(sb.from('products').select('*').eq('id',it.product_id).maybeSingle());if(p)await takeStock(p,num(it.quantity),{movType:'count_adjustment',branch:it.dest_branch_id||inv.branch_id,related_table:'supplier_invoices',related_id:inv.id,notes:'حذف فاتورة شراء'});}
  const seen=new Set();for(const p of pays){if(!p.cash_transaction_id||seen.has(p.cash_transaction_id))continue;seen.add(p.cash_transaction_id);const t=await Q1(sb.from('cash_transactions').select('is_reversed,reversal_of').eq('id',p.cash_transaction_id).maybeSingle());if(t&&!t.is_reversed&&!t.reversal_of)await reverseCashTx(p.cash_transaction_id);}
}
async function deleteSupplier(sid){
  const s=await Q1(sb.from('suppliers').select('*').eq('id',sid).maybeSingle());if(!s)return;

  const fields=invs.length?[{k:'rev',l:'اعكس أثر الفواتير (خصم الأصناف من المخزون + عكس المدفوع في الخزائن)',t:'check',v:true,w:'wide'}]:[];
  const v=await askForm('حذف نهائي للمورد: '+esc(s.name),fields,{ok:'احذف المورد',note:invs.length?`هيتمسح المورد و${invs.length} فاتورة ومدفوعاتها وبنودها. لا يمكن التراجع.`:'الحذف نهائي ولا يمكن التراجع.'});

      await logAudit('supplier_invoices','delete',inv.id,inv);

  });
}

/* توزيع دفعة على أقدم فواتير مورد مفتوحة (بيرجع false لو مفيش فواتير) */
async function allocSupplierPayment(supplierId,amount,date,txId){
  const inv=await Q(sb.from('v_supplier_invoice_detail').select('*').eq('supplier_id',supplierId).gt('remaining',0.01).order('date'));
  if(!inv.length)return false;let left=amount;
  for(const i of inv){if(left<=0.004)break;const pay=Math.min(left,num(i.remaining));
    await sb.from('supplier_payments').insert({supplier_id:supplierId,invoice_id:i.invoice_id,amount:pay,date,cash_transaction_id:txId||null});
    await sb.from('supplier_invoices').update({status:num(i.remaining)-pay<=0.01?'paid':'partial'}).eq('id',i.invoice_id);left-=pay;}
  return true;
}

async function showRegisterDetail(regId){
  const [reg,rows]=await Promise.all([Q1(sb.from('v_register_balances').select('*').eq('register_id',regId).single()),Q(sb.from('v_cash_effective').select('*').eq('register_id',regId).order('date',{ascending:false}).limit(300))]);
  if(!reg)return;
  const by={};rows.forEach(r=>{const k=(CATS[r.category]||r.category)+'|'+r.source_type;const o=by[k]||(by[k]={cat:CATS[r.category]||r.category,src:r.source_type,net:0});o.net+=r.direction==='in'?num(r.amount):-num(r.amount);});
  const cats=Object.values(by).filter(x=>Math.abs(x.net)>0.004).sort((a,b)=>b.net-a.net);
  const capParts=cats.filter(x=>x.src==='capital'),profParts=cats.filter(x=>x.src==='profit');
  const catRows=(list)=>T(['البند','المتاح منه دلوقتي'],list.map(x=>TR([esc(x.cat),`<span class="n ${x.net<0?'neg':'pos'}">${fmt(x.net)}</span>`])),{empty:'لا يوجد'});
  const mismatch=reg.designated_type==='capital'&&Math.abs(reg.profit_balance)>0.01?`فيه مكسب (${fmt(reg.profit_balance)}) دخل الخزنة دي، مع إنها مخصّصة "رأس مال فقط".`
    :reg.designated_type==='profit'&&Math.abs(reg.capital_balance)>0.01?`فيه رأس مال (${fmt(reg.capital_balance)}) دخل الخزنة دي، مع إنها مخصّصة "مكسب فقط".`:null;
  const hist=T(['التاريخ والوقت','الاتجاه','التصنيف','المصدر','المبلغ','ملاحظات'],rows.slice(0,150).map(r=>TR([fdt(r),r.direction==='in'?tag('دخول','g'):tag('خروج','r'),(CATS[r.category]||r.category)+(r.expense_item?` <span class="tag p">${esc(r.expense_item)}</span>`:''),r.source_type==='capital'?tag('رأس مال','a'):tag('مكسب'),`<span class="n">${fmt(r.amount)}</span>`,`<span class="mut">${esc(r.notes||'')}</span>`])),{empty:'لا توجد حركات'});
  openModal(`<div class="mhead">${esc(reg.name)} — تفاصيل الخزنة<button class="x" onclick="closeModal()">×</button></div><div class="mbody">
  <div class="kpis">${K('الرصيد الحالي',fmt(reg.balance),'a')}${K('منه رأس مال',fmt(reg.capital_balance),'')}${K('منه مكسب',fmt(reg.profit_balance),reg.profit_balance>=0?'g':'r')}</div>
  ${mismatch?`<div class="banner"><b>تنبيه:</b> ${esc(mismatch)}</div>`:''}
  <h4>رأس المال داخل الخزنة — متقسم على إيه</h4>${catRows(capParts)}
  <h4>المكسب داخل الخزنة — متقسم على إيه</h4>${catRows(profParts)}
  <p class="note">لو عايز تسحب مبلغ أكبر من المتاح في بند معيّن، الفرق هياخده النظام من باقي بنود نفس النوع (رأس مال أو مكسب) تلقائيًا — استخدم الجدولين دول عشان تعرف الأنسب تسحب منه.</p>
  <h4>آخر حركات هذه الخزنة (150 حركة)</h4>${hist}
  </div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`,{wide:true});
}

async function submitRegXfer(){return once('rx',async()=>{
  const h=gf('f-rx');if(!h)return;if(h.from===h.to)return toast('اختر حسابين مختلفين','err');if(h.amount<=0)return toast('اكتب مبلغًا صحيحًا','err');
  const fee=Math.max(0,num(h.fee));if(fee>h.amount)return toast('العمولة أكبر من المبلغ','err');
  const [rf,rt]=await Promise.all([Q1(sb.from('cash_registers').select('*').eq('id',h.from).single()),Q1(sb.from('cash_registers').select('*').eq('id',h.to).single())]);if(!rf||!rt)return;
  const arriving=h.feekind==='deduct'?Math.round((h.amount-fee)*100)/100:h.amount;
  const g=newGroup();
  const out=await createCashTx({branch_id:rf.branch_id,register_id:h.from,date:h.date,direction:'out',category:'register_transfer',source_type:h.source,amount:h.amount,notes:`تحويل إلى ${rt.name}${h.notes?' — '+h.notes:''}`,group_id:g});if(!out.data)return;
  const inn=await createCashTx({branch_id:rt.branch_id,register_id:h.to,date:h.date,direction:'in',category:'register_transfer',source_type:h.source,amount:arriving,notes:`تحويل من ${rf.name}${h.notes?' — '+h.notes:''}`,group_id:g});if(!inn.data)return;
  if(fee>0.004&&h.feekind==='extra'){const fx=await createCashTx({branch_id:rf.branch_id,register_id:h.from,date:h.date,direction:'out',category:'other',source_type:h.source,amount:fee,notes:'عمولة تحويل بين حسابين',group_id:g});if(!fx.data)return;}
  toast('تم تنفيذ التحويل'+(fee>0.004?` — عمولة ${fmt(fee)}`:''),'ok');refresh();
});}

async function addTransaction(){return once('tx',async()=>{
  const h=gf('f-tx');if(!h||!S.branch)return;if(h.amount<=0)return toast('اكتب مبلغًا صحيحًا','err');
  const url=await uploadedUrl(h.file);
  if(h.dir==='out'){
    const fe=validateFund(h);if(fe)return toast(fe,'err');
    const tx=await spendFunded({branch:S.branch,register:h.reg,date:h.date,amount:h.amount,category:h.cat,source:h.source,notes:h.notes,attachment_url:url,item:h.item||undefined,fund:h.fund,fproj:h.fproj,fbranch:h.fbranch,fpartner:h.fpartner,fother:h.fother});
    if(tx){toast('تم تسجيل الحركة','ok');refresh();}return;
  }
  const {error}=await createCashTx({branch_id:S.branch,register_id:h.reg,date:h.date,direction:'in',category:h.cat,source_type:h.source||'capital',amount:h.amount,notes:h.notes,attachment_url:url,expense_item:h.item||undefined});
  if(!error){toast('تم تسجيل الحركة','ok');refresh();}
});}

async function projectSettled(pid){

async function settleProject(pid){
  const p=await Q1(sb.from('solar_projects').select('*').eq('id',pid).single());if(!p)return;
  const [prof,settled,regs,pf]=await Promise.all([Q(sb.from('solar_project_profitability').select('*').eq('branch_id',p.branch_id)),projectSettled(pid),Q(sb.from('cash_registers').select('id,name,branch_id,active').eq('active',true).order('name')),Q(sb.from('project_funding').select('obligation_id').eq('project_id',pid).eq('is_cancelled',false).not('obligation_id','is',null))]);
  const pr=prof.find(x=>x.project_id===pid)||prof.find(x=>x.project_name===p.project_name)||{};
  const collected=num(pr.total_collected),costs=num(pr.total_material_cost)+num(pr.total_other_cost);
  const oids=pf.map(x=>x.obligation_id);const obls=oids.length?await Q(sb.from('fund_obligations').select('amount,returned').in('id',oids).eq('is_cancelled',false)):[];
  const owed=sum(obls,o=>num(o.amount)-num(o.returned));
  const left=Math.max(0,Math.round((collected-costs-owed-settled)*100)/100);
  const rn=r=>`${r.name} — ${bname(r.branch_id)}`;
  const v=await askForm('إنهاء المشروع وتحويل المكسب — '+esc(p.project_name),[
    {k:'from',l:'الفلوس قاعدة في أنهي خزنة/حساب دلوقتي؟',t:'select',opts:regs.map(r=>[r.id,rn(r)]),v:regs.find(r=>r.branch_id===p.branch_id)?.id,req:1,w:'w2'},
    {k:'to',l:'حوّل المكسب على أنهي حساب؟',t:'select',opts:regs.map(r=>[r.id,rn(r)]),v:regs.find(r=>r.branch_id===p.branch_id)?.id,req:1,w:'w2'},
    {k:'amount',l:'المبلغ اللي هيتحوّل لمكسب',t:'number',v:left,req:1},{k:'date',l:'التاريخ',t:'date',v:todayStr(),req:1},
    {k:'done',l:'علّم المشروع "مكتمل"',t:'check',v:true,w:'wide'},{k:'notes',l:'ملاحظات',w:'wide'}],
    {ok:'حوّل للمكسب',wide:true,note:`<b>حسبة المشروع:</b> المحصّل ${fmt(collected)} − التكاليف ${fmt(costs)} − لسه لازم يرجع للممولين ${fmt(owed)} − اتحوّل قبل كده ${fmt(settled)} = <b>اللي فضل ${fmt(left)}</b>.<br>المتبقي على العميل لسه ${fmt(num(p.contract_amount)-collected)} (ماتحسبش مكسب غير لما يتحصّل).<br>الفلوس بتخرج من الحساب الأول كـ"فلوس شغل" وتدخل الحساب التاني كـ"مكسب" — ودي اللحظة الوحيدة اللي بيتحسب فيها مكسب المشروع.`,
     check:v=>v.amount<=0?'اكتب مبلغًا صحيحًا':null});
  if(!v)return;
  if(v.amount>left+0.01&&!await ask(`المبلغ (${fmt(v.amount)}) أكبر من اللي فضل فعليًا (${fmt(left)}). تكمّل؟`,{ok:'كمّل'}))return;
  await once('settle',async()=>{
    const rf=regs.find(r=>r.id===v.from),rt=regs.find(r=>r.id===v.to),g=newGroup();
    const a=await createCashTx({branch_id:rf.branch_id,register_id:v.from,date:v.date,direction:'out',category:'register_transfer',source_type:'capital',amount:v.amount,notes:`تحويل مكسب مشروع ${p.project_name}${v.notes?' — '+v.notes:''}`,related_table:'solar_projects',related_id:pid,group_id:g});if(!a.data)return;
    const b=await createCashTx({branch_id:rt.branch_id,register_id:v.to,date:v.date,direction:'in',category:'register_transfer',source_type:'profit',amount:v.amount,notes:`مكسب مشروع ${p.project_name}${v.notes?' — '+v.notes:''}`,related_table:'solar_projects',related_id:pid,group_id:g});if(!b.data){await reverseCashTx(a.data.id);return;}
    if(v.done)await sb.from('solar_projects').update({status:'completed',actual_delivery_date:todayStr()}).eq('id',pid);
    await logAudit('solar_projects','settle',pid,{amount:v.amount});toast('اتحوّل المكسب','ok');refresh();
  });
}

async function reclassifyProjectMoney(){

  const sp=si.length?await inChunks(ids=>sb.from('supplier_payments').select('cash_transaction_id').eq('is_cancelled',false).not('cash_transaction_id','is',null).in('invoice_id',ids),si.map(x=>x.id)):[];
  const ids=[...new Set([...ms,...cs,...sp].map(x=>x.cash_transaction_id))];
  const txs=ids.length?await inChunks(ids2=>sb.from('v_cash_effective').select('id,amount,direction').eq('source_type','profit').in('id',ids2),ids):[];
  if(!txs.length)return toast('مفيش فلوس مشاريع متعلّم عليها "مكسب"','ok');
  const inn=sum(txs.filter(t=>t.direction==='in'),'amount'),out=sum(txs.filter(t=>t.direction==='out'),'amount');
  if(!await ask(`هيتحوّل ${txs.length} حركة تخص المشاريع من "مكسب" إلى "فلوس شغل":\n• تحصيلات داخلة ${fmt(inn)}\n• مصاريف ومشتريات خارجة ${fmt(out)}\n\nالمكسب المتراكم هيقل بـ ${fmt(inn-out)} — وبعدها تحوّل مكسب كل مشروع بعد ما يخلص بزرار "إنهاء + تحويل المكسب". مفيش أي فلوس بتتحرك، ده بس تصنيف. متأكد؟`,{ok:'حوّل التصنيف'}))return;
  await once('reclass',async()=>{
    for(let i=0;i<txs.length;i+=80){const r=await sb.from('cash_transactions').update({source_type:'capital'}).in('id',txs.slice(i,i+80).map(t=>t.id));if(r.error)return toast('تعذّر التحويل: '+r.error.message,'err');}

  });
}

async function addWellItem(){return once('wi',async()=>{
  const h=gf('f-wi');if(!h)return;if(h.qty<=0)return toast('اكتب كمية صحيحة','err');

  const unitCost=h.cost!=null?num(h.cost):num(prod?.current_cost);
  const supplierId=prod?(prod.supplier_id||null):(h.supplier||null);
  let usageId=null,costId=null;
  if(prod){
    if(num(prod.current_quantity)<h.qty&&!await ask(`الكمية أكبر من المتاح من ${esc(prod.name)} (${prod.current_quantity}). تكمّل؟`,{ok:'كمّل'}))return;

  }else if(unitCost*h.qty>0){
    let txId=null;const total=unitCost*h.qty;
    if(h.reg){const fe=validateFund(h);if(fe)return toast(fe,'err');const tx=await spendFunded({branch:S.branch,register:h.reg,date:h.date,amount:total,category:'daily_expense',source:h.source,notes:`بند بئر: ${WCL[h.cat]} — ${name}`,fund:h.fund,fproj:h.fproj,fbranch:h.fbranch,fpartner:h.fpartner,fother:h.fother});if(!tx)return;txId=tx.id;}
    const c=await M(sb.from('solar_project_costs').insert({project_id:h.project,branch_id:S.branch,cost_type:h.cat==='transport'?'transport':'other',component:'well',amount:total,date:h.date,cash_transaction_id:txId,notes:`بند بئر: ${name}`}).select().single());if(!c)return;costId=c.id;
  }
  if(!await M(sb.from('solar_well_items').insert({project_id:h.project,branch_id:S.branch,category:h.cat,item_name:name,product_id:prod?.id||null,supplier_id:supplierId,quantity:h.qty,unit_cost:unitCost,unit_price:num(h.price),usage_id:usageId,cost_id:costId,date:h.date||todayStr(),notes:h.notes||null}),'تمت إضافة البند'))return;
  await recomputeWell(h.project);refresh();
});}
